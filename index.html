<style>

#wrap.playing{cursor:none}

#hud{pointer-events:none}
.screen{position:absolute;left:0;top:0;right:0;bottom:0;display:none;flex-direction:column;align-items:center;background:rgba(6,9,7,.94);overflow:auto;padding:1em 1.4em;z-index:5;touch-action:pan-y;-webkit-overflow-scrolling:touch}
textarea,input{font:inherit;font-size:.9em;background:#0c100a;color:#e8f0d8;border:.1em solid #6f8a4a;padding:.3em;user-select:text;-webkit-user-select:text}
textarea{width:100%;height:4.2em;resize:vertical;word-break:break-all;margin:.2em 0}
.netbox{width:100%;max-width:56em;display:flex;flex-direction:column;gap:.5em;margin-bottom:.5em}
.help1{max-width:52em;color:#9aa88e;line-height:1.45;margin-top:1em}
.screen.on{display:flex}
h1{font-size:4.2em;margin:.35em 0 0;color:#d83a2e;letter-spacing:.18em;text-shadow:.07em .07em 0 #4a0c08}
h2{font-size:2.4em;margin:.6em 0 .3em;letter-spacing:.12em}
.red{color:#e04434}.gold{color:#ffd84a}.warn{color:#ff7a4a}.dim{color:#7d8a74}
.tag{color:#9db08a;margin:.2em 0 1em;letter-spacing:.1em}
.col{display:flex;flex-direction:column;align-items:stretch;min-width:18em}
button{font:inherit;font-weight:bold;color:#e8f0d8;background:#26321d;border:.14em solid #6f8a4a;padding:.5em 1.2em;margin:.3em;cursor:pointer;text-transform:uppercase}
button:hover:not(:disabled){background:#3d5228;border-color:#b8e070}
button:disabled{opacity:.35;cursor:default}
button.sm{padding:.05em .5em;margin:0 0 0 .5em;font-size:.92em;text-transform:none}
button.big{font-size:1.4em;padding:.5em 2em;margin-top:.6em;background:#5a1c14;border-color:#e0644a}
button.big:hover{background:#8a2a1c !important;border-color:#ffb090 !important}
.help{margin-top:1em;color:#9aa88e;line-height:1.5;max-width:60em;text-align:left;columns:2;column-gap:3em;font-size:.95em}
.help b{color:#e8f0d8}
.bhead{display:flex;justify-content:space-between;width:100%;font-size:1.25em;border-bottom:.12em solid #3a4a30;padding-bottom:.3em;margin-bottom:.4em}
.money{color:#ffd84a;font-weight:bold}
.sum{width:100%;color:#b8c8a4;margin-bottom:.4em}
.row{display:flex;gap:.6em;width:100%;margin-bottom:.5em;align-items:stretch}
.card{border:.12em solid #3a4a30;background:#10150e;padding:.4em .6em;flex:1;min-width:0}
.card.pick{cursor:pointer}
.card.pick:hover{border-color:#8fae62}
.card.sel{border-color:#ffd84a;background:#1b2014}
.card h3{margin:0 0 .3em;font-size:1.05em;color:#ffd84a;letter-spacing:.06em}
.line{display:flex;justify-content:space-between;align-items:center;margin:.18em 0;gap:.5em}
.pips{letter-spacing:.1em;color:#8fd060}
.sw{display:inline-block;width:.9em;height:.9em;margin-right:.4em;vertical-align:-.1em;border:.08em solid #000}
select{font:inherit;background:#1a2014;color:#e8f0d8;border:.1em solid #6f8a4a;padding:.1em .2em;max-width:13em}
.shop{display:grid;grid-template-columns:repeat(3,1fr);gap:.5em;width:100%}
.shop .card{font-size:.92em}
.lock{opacity:.45}
table.st{border-collapse:collapse;margin:.6em 0}
table.st td{padding:.2em 1.2em;border-bottom:.08em solid #2c3824}
table.st td:last-child{text-align:right;color:#ffd84a;font-weight:bold}

</head>
<body>
<div id="wrap">
  <canvas id="game" width="640" height="360"></canvas>
  <canvas id="hud"></canvas>

    <h1>БАШНЯ&nbsp;Z</h1>

  </div>
  <div id="scrPause" class="screen">

  </div>

  <div id="scrDead" class="screen">

    <div class="col">

      <button data-act="menu">В главное меню</button>
    </div>

    <div id="winInfo"></div>
    <div class="col"><button data-act="menu">В главное меню</button></div>

</div>

  initialShare:.4,                                // доля, расставленная по комнатам сразу (остальные идут волнами)
  maxAlive:1200,                                  // предел одновременно живых
  hordeInterval:f=>Math.max(9,22-f*.5),           // секунд между ордами
  hordeSize:f=>Math.round(3*(8+f*1.6)),
  hordeGroup:14,                                  // орда дробится на группы не больше этого размера
  zHpMul:f=>1+(f-1)*.02,
  zDmgMul:f=>1+(f-1)*.03,
  floorMoney:f=>250+90*f,
  floorXp:f=>100+25*f,
  bossMoney:f=>800+60*f,
  dropAmmo:.015,dropMed:.006,crateCh:.5,          // выпадение патронов/аптечек с зомби, шанс ящика в комнате

const Z_WALKER=0,Z_RUNNER=1,Z_CRAWLER=2,Z_FATTY=3,Z_BOOMER=4,Z_SPITTER=5;
function zombieMix(f){ // веса типов по этажам
  const m=[[Z_WALKER,100]];
  if(f>=2)m.push([Z_RUNNER,Math.min(45,6+f*2.2)]);
  if(f>=4)m.push([Z_CRAWLER,Math.min(30,6+f*1.4)]);
  if(f>=6)m.push([Z_FATTY,Math.min(14,2+f*.55)]);
  if(f>=8)m.push([Z_BOOMER,Math.min(14,3+f*.55)]);
  if(f>=11)m.push([Z_SPITTER,Math.min(14,3+f*.5)]);
  return m;
}

  clear(){this.n=0;}
  push(k,v){if(this.n>=this.cap)return;const K=this.k,V=this.v;let i=this.n++;while(i>0){const p=(i-1)>>1;if(K[p]<=k)break;K[i]=K[p];V[i]=V[p];i=p;}K[i]=k;V[i]=v;}

    const g=c.createGain();g.gain.value=.5;g.connect(comp);comp.connect(c.destination);AU.out=g;

  o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);

}
function noise(dur,vol,f0,f1,ftype,delay){
  const c=AU.ctx;if(!c||AU.mute)return;const t=c.currentTime+(delay||0);

}

function boxFree(x,y,h){return !(solidAt(x-h,y-h)||solidAt(x+h,y-h)||solidAt(x-h,y+h)||solidAt(x+h,y+h));}
function moveEnt(e,dx,dy,h){
  if(!boxFree(e.x,e.y,h)){e.x=clamp(e.x+dx,20,MW*TS-20);e.y=clamp(e.y+dy,20,MH*TS-20);return;} // застрял в тайле — даём выйти
  if(dx!==0&&boxFree(e.x+dx,e.y,h))e.x+=dx;
  if(dy!==0&&boxFree(e.x,e.y+dy,h))e.y+=dy;
}
function slideAssist(e,mx,my,bx,by,st,h){ // упёрся по одной оси — выравниваемся по другой к центру своего тайла
  if(Math.abs(mx)>.3&&Math.abs(e.x-bx)<Math.abs(mx)*st*.3){const d=((e.y>>4)<<4)+8-e.y;if(Math.abs(d)>.5)moveEnt(e,0,Math.sign(d)*Math.min(Math.abs(d),st),h);}
  else if(Math.abs(my)>.3&&Math.abs(e.y-by)<Math.abs(my)*st*.3){const d=((e.x>>4)<<4)+8-e.x;if(Math.abs(d)>.5)moveEnt(e,Math.sign(d)*Math.min(Math.abs(d),st),0,h);}
}
function walkLine(x0,y0,x1,y1,h){const dx=x1-x0,dy=y1-y0,n=Math.ceil(Math.hypot(dx,dy)/5);for(let i=1;i<=n;i++)if(!boxFree(x0+dx*i/n,y0+dy*i/n,h))return false;return true;}
function losShot(x0,y0,x1,y1){const dx=x1-x0,dy=y1-y0,n=Math.ceil(Math.hypot(dx,dy)/6);for(let i=1;i<n;i++){const t=map[tIdx(x0+dx*i/n,y0+dy*i/n)];if(SOLID[t]&&t!==T.GLASS)return false;}return true;}
function clipLine(x0,y0,x1,y1){const dx=x1-x0,dy=y1-y0,n=Math.ceil(Math.hypot(dx,dy)/4);let lx=x0,ly=y0;for(let i=1;i<=n;i++){const x=x0+dx*i/n,y=y0+dy*i/n,t=map[tIdx(x,y)];if(SOLID[t]&&t!==T.GLASS)break;lx=x;ly=y;}return {x:lx,y:ly};}
function passSquad(t){return !SOLID[t]||t===T.DOOR;}
function nearFree(gi){const gx=gi%MW,gy=(gi/MW)|0;let best=-1,bd=99;for(let y=gy-3;y<=gy+3;y++)for(let x=gx-3;x<=gx+3;x++){if(x<1||y<1||x>=MW-1||y>=MH-1)continue;if(SOLID[map[x+y*MW]])continue;const d=Math.abs(x-gx)+Math.abs(y-gy);if(d<bd){bd=d;best=x+y*MW;}}return best;}
function volAt(x,y){if(!player)return 1;return clamp(1-Math.hypot(x-player.x,y-player.y)/420,.12,1);}
function miniPx(i){miniCtx.fillStyle=MINI_COL[map[i]];miniCtx.fillRect(i%MW,(i/MW)|0,1,1);}
function setTile(i,t){const o=map[i];map[i]=t;if(TILE_HP[t]>0&&thp[i]<=0)thp[i]=TILE_HP[t];drawTile(i);navDirty=true;visDirty=true;nev('t',i,t,o);}
function openDoor(i){if(map[i]!==T.DOOR)return false;setTile(i,T.DOOR_OPEN);sfx('door',volAt(tcx(i),tcy(i)));noiseAt(tcx(i),tcy(i),5*TS);return true;}
function tileOccupied(i){
  const x0=(i%MW)*TS-4,y0=((i/MW)|0)*TS-4,x1=x0+TS+8,y1=y0+TS+8;
  for(const s of squad)if(s.x>x0&&s.x<x1&&s.y>y0&&s.y<y1)return true;
  for(let k=0;k<zN;k++){const z=zombies[k];if(!z.dead&&z.x>x0&&z.x<x1&&z.y>y0&&z.y<y1)return true;}
  return false;
}
function toggleDoor(i){
  if(map[i]===T.DOOR)return openDoor(i);
  if(map[i]===T.DOOR_OPEN){if(tileOccupied(i)){sfx('deny');return false;}setTile(i,T.DOOR);sfx('door');return true;}
  return false;
}
function damageTile(i,dmg,src){ // src: 0/undefined — пуля, огонь, удар; 1 — взрыв; 2 — таран босса
  const t=map[i];if(!SOLID[t]||t===T.HARD)return false;
  if(WALLISH[t]&&!src)return false;                 // стены и перегородки пулями не пробить
  if(NET.role==='guest')return false;               // у гостя разрушения приходят от хоста
  thp[i]-=dmg;
  if(thp[i]<=0){destroyTile(i);return true;}
  if(t===T.WALL||t===T.DOOR||t===T.PART||t===T.FURN){ // трещины остаются до конца этажа; от взрывов — крупнее
    const x=(i%MW)*TS,y=((i/MW)|0)*TS,n=src?3:1;wallCtx.fillStyle='rgba(0,0,0,.5)';
    for(let k=0;k<n;k++)wallCtx.fillRect(x+rndi(1,13),y+rndi(1,13),rndi(1,src?3:2),rndi(1,2));
  }
  return false;
}
function bakeBits(cx,cy,n,cols,r){for(let k=0;k<n;k++){floorCtx.fillStyle=pick(cols);floorCtx.fillRect((cx+rnd(-r,r))|0,(cy+rnd(-r,r))|0,rndi(1,3),rndi(1,2));}}
function tileFx(t,cx,cy){ // визуальная часть разрушения тайла (общая для хоста и гостя)
  const v=volAt(cx,cy);
  switch(t){
    case T.GLASS:debris(cx,cy,8,'#bfe8f4',60);bakeBits(cx,cy,10,['#bfe8f4','#8ecfe0','#e8fbff'],7);sfx('glass',v);break;
    case T.DOOR:debris(cx,cy,8,'#8a5a2a',70);bakeBits(cx,cy,8,['#8a5a2a','#6b4420','#3a2410'],7);sfx('break',v);break;
    case T.FURN:debris(cx,cy,7,'#6a5a44',60);bakeBits(cx,cy,10,['#5a4a34','#3a3026','#7a6a54'],7);sfx('break',v*.8);break;
    case T.WALL:case T.PART:{const th=F.theme;debris(cx,cy,12,t===T.WALL?th.wall:'#7d858e',90);dust(cx,cy,6);
      bakeBits(cx,cy,26,[th.wallD,th.wall,'#3a3a36','#55524a'],8);sfx('break',v);break;}
  }
}
function destroyTile(i){
  const t=map[i],cx=tcx(i),cy=tcy(i);let nt=T.FLOOR;
  switch(t){
    case T.BARREL:blasts.push({x:cx,y:cy,r:48,dmg:140,owner:-1,t:rnd(.06,.16),ff:BAL.ffBarrel,fire:false});break;
    case T.GAS:blasts.push({x:cx,y:cy,r:58,dmg:110,owner:-1,t:rnd(.06,.16),ff:BAL.ffBarrel,fire:true});break;
    case T.GLASS:case T.DOOR:case T.FURN:break;
    case T.WALL:case T.PART:nt=T.RUBBLE;if(P)P.stats.walls++;break;
    default:return;
  }
  tileFx(t,cx,cy);
  map[i]=nt;thp[i]=0;drawTile(i);navDirty=true;visDirty=true;
  nev('t',i,nt,t);
}
/* --- обзор: конусы зрения бойцов, лучи по сетке тайлов ---
   vis[i]  — тайл виден кем-то из живых бойцов прямо сейчас (враги, лут и снаряды рисуются только там);
   seen[i] — тайл разведан (показывается затемнённым «по памяти»); остальное — чёрное. */
const rvQ=new Int32Array(MN);
const VIS_HALF=.96,VIS_RANGE=14,VIS_NEAR=1.5; // полуугол конуса (≈110° всего), дальность и ближний круг в тайлах
function markSeen(i){if(!seen[i]){seen[i]=1;miniPx(i);}}
function castRay(x,y,a,len){ // луч идёт до первой непрозрачной клетки (стена, закрытая дверь) и освещает её
  const dx=Math.cos(a)*6,dy=Math.sin(a)*6,n=(len/6)|0;let qx=x,qy=y;
  for(let s=0;s<n;s++){
    qx+=dx;qy+=dy;const i=tIdx(qx,qy);
    if(!vis[i]){vis[i]=1;if(!seen[i])markSeen(i);}
    if(OPAQUE[map[i]])return;
  }
}
function castCone(x,y,a,half,len,rays){for(let r=0;r<rays;r++)castRay(x,y,a-half+2*half*r/(rays-1),len);}
function castCircle(x,y,len,rays){const i=tIdx(x,y);vis[i]=1;markSeen(i);for(let r=0;r<rays;r++)castRay(x,y,r/rays*TAU,len);}
function addLight(x,y,rTiles,dur){if(lights.length<8)lights.push({x,y,r:rTiles*TS,t:dur});} // вспышка взрыва освещает округу
function bossVisible(){const b=boss;return !!(vis[tIdx(b.x,b.y)]||vis[tIdx(b.x+b.r,b.y)]||vis[tIdx(b.x-b.r,b.y)]||vis[tIdx(b.x,b.y+b.r)]||vis[tIdx(b.x,b.y-b.r)]);}
function updateVision(dt){
  // пересчёт только если кто-то сдвинулся/повернулся, изменились стены или горит свет
  let dirty=visDirty||lights.length>0;
  for(const s of squad){
    if(s.flashT>0){s.flashT-=dt;dirty=true;}
    const st=s.down?1:0;
    if(Math.abs(s.x-s.vX)>1||Math.abs(s.y-s.vY)>1||Math.abs(s.ang-s.vA)>.02||st!==s.vD){s.vX=s.x;s.vY=s.y;s.vA=s.ang;s.vD=st;dirty=true;}
  }
  for(const h of hazards)if(h.k==='fire'){dirty=true;break;}
  if(dirty){
    visDirty=false;vis.fill(0);
    for(const s of squad){
      if(s.down)continue;                                                       // упавший боец обзора не даёт
      castCircle(s.x,s.y,(s.flashT>0?3.5:VIS_NEAR)*TS,s.flashT>0?40:20);        // ближний круг (шире на вспышке выстрела)
      castCone(s.x,s.y,s.ang,VIS_HALF,VIS_RANGE*TS,s.isPlayer?72:56);           // конус по направлению взгляда
    }
    for(let i=lights.length-1;i>=0;i--){const l=lights[i];castCircle(l.x,l.y,l.r,36);l.t-=dt;if(l.t<=0)lights.splice(i,1);}
    for(const h of hazards)if(h.k==='fire')castCircle(h.x,h.y,h.r+2*TS,24);
  }
  const up=Math.min(1,dt*14),dn=Math.min(1,dt*7),d=lightImg.data; // плавное проявление и затухание
  for(let i=0;i<MN;i++){
    const l=lum[i],nl=vis[i]?l+(1-l)*up:l-l*dn;lum[i]=nl;
    d[i*4+3]=seen[i]?((1-nl)*158)|0:255;
  }
  lightCtx.putImageData(lightImg,0,0);
}
function drawLight(c,ox,oy){ // карта затемнения растягивается со сглаживанием — мягкая граница конуса на пиксельной сетке
  const sx=Math.max(0,ox/TS),sy=Math.max(0,oy/TS),ex=Math.min(MW,(ox+VW)/TS),ey=Math.min(MH,(oy+VH)/TS);
  if(ex<=sx||ey<=sy)return;
  c.imageSmoothingEnabled=true;
  c.drawImage(lightCv,sx,sy,ex-sx,ey-sy,sx*TS-ox,sy*TS-oy,(ex-sx)*TS,(ey-sy)*TS);
  c.imageSmoothingEnabled=false;
}
function hearAt(x,y,str){ // слабый индикатор направления на шум вне поля зрения
  if(!F||!player)return;const d=distXY(player,x,y);if(d>380)return;
  const a=Math.atan2(y-player.y,x-player.x),s=str*clamp(1.25-d/380,0,1);
  for(const h of F.heard)if(Math.abs(angDiff(h.a,a))<.35){h.t=Math.max(h.t,.9);h.s=Math.max(h.s,s);h.a+=angDiff(h.a,a)*.3;return;}
  if(F.heard.length<10)F.heard.push({a,t:.9,s});
}
function revealAll(){seen.fill(1);for(let i=0;i<MN;i++)miniPx(i);}

/* --- отрисовка тайлов (пиксельная графика кодом) --- */
function drawFloorTile(c,tx,ty){
  const th=F.theme,x=tx*TS,y=ty*TS,v=tvar[tx+ty*MW];
  switch(F.roof?5:th.style){
    case 0: // мрамор вестибюля
      px(c,((tx>>1)+(ty>>1))&1?th.f1:th.f2,x,y,16,16);px(c,'rgba(0,0,0,.14)',x,y+15,16,1);px(c,'rgba(0,0,0,.14)',x+15,y,1,16);
      if(v&1)px(c,'rgba(255,255,255,.07)',x+(v&7)+2,y+((v>>3)&7)+2,3,1);break;
    case 1: // ковролин офиса
      px(c,th.f1,x,y,16,16);for(let k=0;k<5;k++)px(c,k&1?th.f2:'rgba(255,255,255,.04)',x+((v*(k+3))&15),y+((v*(k+7)>>2)&15),1,1);break;
    case 2: // плитка лаборатории
      px(c,th.f1,x,y,16,16);px(c,th.f2,x,y+15,16,1);px(c,th.f2,x+15,y,1,16);px(c,th.f2,x+7,y,1,16);px(c,th.f2,x,y+7,16,1);
      if((v&31)===3)px(c,'rgba(60,140,90,.25)',x+3,y+4,4,3);break;
    case 3: // паркет апартаментов
      px(c,th.f1,x,y,16,16);for(let k=0;k<4;k++){px(c,th.f2,x,y+k*4+3,16,1);px(c,th.f2,x+((k*5+(ty&1)*3)&15),y+k*4,1,3);}break;
    case 4: // тёмный мрамор пентхауса
      px(c,(tx+ty)&1?th.f1:th.f2,x,y,16,16);px(c,'rgba(0,0,0,.2)',x,y+15,16,1);px(c,'rgba(0,0,0,.2)',x+15,y,1,16);
      if((v&15)===5){px(c,'rgba(200,170,90,.35)',x+3,y+5,5,1);px(c,'rgba(200,170,90,.35)',x+7,y+6,4,1);}break;
    default: // крыша
      px(c,'#4a4e52',x,y,16,16);for(let k=0;k<4;k++)px(c,k&1?'#42464a':'#54585c',x+((v*(k+5))&15),y+((v*(k+9)>>2)&15),2,1);
      if((tx&3)===0)px(c,'#3a3d40',x,y,1,16);if((ty&3)===0)px(c,'#3a3d40',x,y,16,1);
  }
}
function drawFurn(c,x,y,st,v){
  const pl=FURN_PAL[st],k=(v>>1)%3;
  px(c,'rgba(0,0,0,.3)',x+2,y+3,13,13);
  if(k===0){px(c,pl[0],x+1,y+2,14,12);px(c,pl[1],x+2,y+3,12,10);px(c,pl[2],x+4,y+5,5,3);px(c,pl[3],x+10,y+8,3,3);}
  else if(k===1){px(c,pl[0],x+2,y+1,12,14);px(c,pl[1],x+3,y+2,10,5);px(c,pl[2],x+3,y+8,10,1);px(c,pl[1],x+3,y+10,10,4);}
  else{px(c,pl[5],x+5,y+2,6,12);px(c,pl[5],x+2,y+5,12,6);px(c,pl[6],x+4,y+4,8,8);px(c,pl[5],x+6,y+6,2,2);px(c,pl[4],x+7,y+7,3,3);}
}
function drawTile(i){
  const tx=i%MW,ty=(i/MW)|0,x=tx*TS,y=ty*TS,t=map[i],v=tvar[i],c=wallCtx,th=F.theme;
  c.clearRect(x,y,TS,TS);
  switch(t){
    case T.HARD: // несущая стена
      px(c,'#22262b',x,y,16,16);px(c,'#3d444c',x+1,y+1,14,14);px(c,'#4f5861',x+1,y+1,14,1);px(c,'#4f5861',x+1,y+1,1,14);px(c,'#2b3036',x+4,y+4,8,8);
      px(c,'#6b7480',x+2,y+2,1,1);px(c,'#6b7480',x+13,y+2,1,1);px(c,'#6b7480',x+2,y+13,1,1);px(c,'#6b7480',x+13,y+13,1,1);break;
    case T.WALL:
      px(c,th.wallD,x,y,16,16);px(c,th.wall,x,y,15,15);px(c,th.wallL,x,y,15,1);px(c,th.wallL,x,y,1,15);
      px(c,th.wallD,x+1,y+7,14,1);px(c,th.wallD,x+(v&1?5:10),y+1,1,6);px(c,th.wallD,x+(v&2?4:11),y+8,1,7);break;
    case T.DOOR:
      px(c,'#2e1e0e',x,y,16,16);px(c,'#8a5a2a',x+1,y+1,14,14);px(c,'#a06a34',x+2,y+2,12,2);px(c,'#6b4420',x+5,y+1,1,14);px(c,'#6b4420',x+10,y+1,1,14);px(c,'#e0c060',x+12,y+7,2,2);break;
    case T.DOOR_OPEN:
      if(v&1){px(c,'#8a5a2a',x,y,16,3);px(c,'#2e1e0e',x,y+3,16,1);}else{px(c,'#8a5a2a',x,y,3,16);px(c,'#2e1e0e',x+3,y,1,16);}break;
    case T.GLASS:
      px(c,'rgba(140,210,235,.36)',x,y,16,16);px(c,'#d8f4ff',x,y,16,1);px(c,'#5a8a9a',x,y+15,16,1);px(c,'#5a8a9a',x,y,1,16);px(c,'#5a8a9a',x+15,y,1,16);
      px(c,'rgba(255,255,255,.55)',x+4,y+9,1,1);px(c,'rgba(255,255,255,.55)',x+5,y+8,1,1);px(c,'rgba(255,255,255,.55)',x+6,y+7,1,1);px(c,'rgba(255,255,255,.55)',x+9,y+10,1,1);px(c,'rgba(255,255,255,.55)',x+10,y+9,1,1);break;
    case T.PART:
      px(c,'#4a4f55',x,y,16,16);px(c,'#7d858e',x+1,y+1,14,13);px(c,'#99a2ab',x+1,y+1,14,2);px(c,'#5d646c',x+7,y+3,1,11);break;
    case T.FURN:drawFurn(c,x,y,F.roof?5:th.style,v);break;

      px(c,'rgba(0,0,0,.3)',x+4,y+5,11,10);px(c,'#5a0e0e',x+4,y+2,8,12);px(c,'#5a0e0e',x+2,y+4,12,8);px(c,'#b82424',x+4,y+3,8,10);px(c,'#b82424',x+3,y+4,10,8);
      px(c,'#e05a48',x+5,y+4,3,3);px(c,'#e8d040',x+3,y+7,10,2);px(c,'#401010',x+7,y+7,2,2);break;
    case T.GAS:
      px(c,'rgba(0,0,0,.3)',x+6,y+3,8,13);px(c,'#7a4a08',x+4,y+2,8,13);px(c,'#e09a20',x+5,y+3,6,11);px(c,'#ffd060',x+6,y+4,2,6);px(c,'#c0c8d0',x+7,y,2,3);px(c,'#a02020',x+5,y+10,6,2);break;
  }
  if(seen[i])miniPx(i);

function renderMap(){
  const th=F.theme;th.wallL=shade(th.wall,1.15);
  for(let ty=0;ty<MH;ty++)for(let tx=0;tx<MW;tx++)drawFloorTile(floorCtx,tx,ty);
  for(let i=0;i<MN;i++)if(map[i]===T.STAIRS){const x=(i%MW)*TS,y=((i/MW)|0)*TS;px(floorCtx,'#22221e',x,y,16,16);for(let k=0;k<4;k++)px(floorCtx,k&1?'#b89a20':'#e0c030',x+1,y+1+k*4,14,3);}
  if(F.roof){floorCtx.strokeStyle='#d8c040';floorCtx.lineWidth=2;floorCtx.beginPath();floorCtx.arc(F.bx,F.by,72,0,TAU);floorCtx.stroke();px(floorCtx,'#d8c040',F.bx-22,F.by-30,6,60);px(floorCtx,'#d8c040',F.bx+16,F.by-30,6,60);px(floorCtx,'#d8c040',F.bx-22,F.by-3,44,6);}
  wallCtx.clearRect(0,0,wallCv.width,wallCv.height);
  for(let i=0;i<MN;i++)drawTile(i);
  miniCtx.clearRect(0,0,MW,MH);
}

/* =====================================================================
   7. ГЕНЕРАЦИЯ ЭТАЖЕЙ
   ===================================================================== */
function calcDStart(){ // расстояние в тайлах от точки старта (для расстановки зомби и лестницы)
  dStart.fill(-1);const q=rvQ;let h=0,t=0;const s=tIdx(F.sx,F.sy);dStart[s]=0;q[t++]=s;
  while(h<t){const i=q[h++];for(let k=0;k<4;k++){const j=i+DOFF[k];if(j<0||j>=MN||dStart[j]>=0||!passSquad(map[j]))continue;dStart[j]=dStart[i]+1;q[t++]=j;}}
}
function pickCrate(){const r=Math.random();return r<.5?'ammo':r<.75?'med':r<.9?'gren':'cash';}
function genRooms(){
  const th=F.theme;
  function carve(r,type){r.id=regions.length;r.type=type;regions.push(r);for(let y=r.y0+1;y<r.y1;y++)for(let x=r.x0+1;x<r.x1;x++){const i=x+y*MW;map[i]=T.FLOOR;region[i]=r.id;}}
  function split(x0,y0,x1,y1,d){ // BSP: прямоугольник со стенами по границам
    const w=x1-x0,h=y1-y0,mn=th.minRoom+1,canV=w>=2*mn,canH=h>=2*mn,big=w>th.maxRoom+1||h>th.maxRoom+1;
    if((!canV&&!canH)||(!big&&Math.random()<.7)){carve({x0,y0,x1,y1},'room');return;}
    let vert;if(canV&&canH)vert=w>h*1.25?true:h>w*1.25?false:Math.random()<.5;else vert=canV;
    const a0=vert?x0:y0,len=vert?w:h,cw=4;
    if(d<th.corrDepth&&len>=2*mn+cw+2){ // на верхних уровнях режем коридором
      const s=a0+mn+Math.round((len-2*mn-cw)*rnd(.3,.7));
      if(vert){split(x0,y0,s,y1,d+1);carve({x0:s,y0,x1:s+cw,y1},'corr');split(s+cw,y0,x1,y1,d+1);}
      else{split(x0,y0,x1,s,d+1);carve({x0,y0:s,x1,y1:s+cw},'corr');split(x0,s+cw,x1,y1,d+1);}
    }else{
      const s=a0+mn+rndi(0,len-2*mn);
      if(vert){split(x0,y0,s,y1,d+1);split(s,y0,x1,y1,d+1);}else{split(x0,y0,x1,s,d+1);split(x0,s,x1,y1,d+1);}
    }
  }
  split(0,0,MW-1,MH-1,0);
  // колонны на пересечениях стен — несущие
  for(let y=1;y<MH-1;y++)for(let x=1;x<MW-1;x++){const i=x+y*MW;if(map[i]!==T.WALL)continue;
    const hz=map[i-1]!==T.FLOOR||map[i+1]!==T.FLOOR,vt=map[i-MW]!==T.FLOOR||map[i+MW]!==T.FLOOR;if(hz&&vt)map[i]=T.HARD;}
  // смежность областей через общие стены
  const pm=new Map(),pairs=[];
  for(let y=1;y<MH-1;y++)for(let x=1;x<MW-1;x++){
    const i=x+y*MW;if(map[i]!==T.WALL)continue;
    let a=region[i-1],b=region[i+1],hor=1;
    if(a<0||b<0||a===b){a=region[i-MW];b=region[i+MW];hor=0;}
    if(a<0||b<0||a===b)continue;
    const key=Math.min(a,b)*4096+Math.max(a,b);let p=pm.get(key);
    if(!p){p={a,b,hor,tiles:[],done:false};pm.set(key,p);pairs.push(p);}
    p.tiles.push(i);
  }
  const uf=regions.map((_,i)=>i);
  const find=i=>{while(uf[i]!==i){uf[i]=uf[uf[i]];i=uf[i];}return i;};
  const union=(a,b)=>{uf[find(a)]=find(b);};
  for(const p of pairs){ // коридоры сливаются между собой
    if(regions[p.a].type==='corr'&&regions[p.b].type==='corr'){for(const i of p.tiles){map[i]=T.FLOOR;region[i]=p.a;}union(p.a,p.b);p.done=true;}
  }
  shuffle(pairs);
  const prio=p=>(regions[p.a].type==='corr'||regions[p.b].type==='corr')?0:1;
  pairs.sort((p,q)=>prio(p)-prio(q));
  for(const p of pairs){
    if(p.done)continue;
    if(find(p.a)!==find(p.b)||Math.random()<th.extraDoor){
      union(p.a,p.b);const n=p.tiles.length;
      if(n>=4&&Math.random()<th.openCh){const w=Math.min(n-2,rndi(2,3)),k=rndi(1,n-1-w);for(let j=k;j<k+w;j++){map[p.tiles[j]]=T.FLOOR;region[p.tiles[j]]=p.a;}}
      else{const k=n>=3?rndi(1,n-2):0,i=p.tiles[k];map[i]=T.DOOR;tvar[i]=(tvar[i]&254)|p.hor;}
    }
  }
  for(const p of pairs){ // материалы стен: перегородки и стёкла
    if(p.done)continue;const rr=regions[p.a].type==='room'&&regions[p.b].type==='room';
    if(rr&&Math.random()<th.partCh){for(const i of p.tiles)if(map[i]===T.WALL)map[i]=T.PART;}
    else if(p.tiles.length>=4&&Math.random()<th.glassCh){const n=p.tiles.length,w=rndi(2,Math.min(5,n-1)),k=rndi(0,n-w);for(let j=k;j<k+w;j++)if(map[p.tiles[j]]===T.WALL)map[p.tiles[j]]=T.GLASS;}
  }
  // старт и лестница
  const rooms=regions.filter(r=>r.type==='room');
  const corner=pick([[0,0],[MW,0],[0,MH],[MW,MH]]);
  let startR=rooms[0],bd=1e9;
  for(const r of rooms){r.cx=(r.x0+r.x1)>>1;r.cy=(r.y0+r.y1)>>1;const d=Math.hypot(r.cx-corner[0],r.cy-corner[1]);if(d<bd){bd=d;startR=r;}}
  F.sx=startR.cx*TS+8;F.sy=startR.cy*TS+8;F.startR=startR;
  calcDStart();
  let stairR=startR,far=-1;
  for(const r of rooms){const d=dStart[r.cx+r.cy*MW];if(d>far){far=d;stairR=r;}}
  for(let dy=0;dy<2;dy++)for(let dx=0;dx<2;dx++)map[stairR.cx+dx+(stairR.cy+dy)*MW]=T.STAIRS;
  F.stx=(stairR.cx+1)*TS;F.sty=(stairR.cy+1)*TS;
  // мебель, бочки, ящики (внутреннее кольцо у стен всегда свободно — проходы не блокируются)
  for(const r of rooms){
    if(r===startR)continue;
    for(let y=r.y0+2;y<=r.y1-2;y++)for(let x=r.x0+2;x<=r.x1-2;x++){
      const i=x+y*MW;if(map[i]!==T.FLOOR)continue;
      if(r===stairR&&Math.abs(x-stairR.cx)<=2&&Math.abs(y-stairR.cy)<=2)continue;
      const q=Math.random(),fm=th.style===1?(((x-r.x0)%3!==0&&(y-r.y0)%2===0)?2.4:.15):1;
      if(q<th.barrel)map[i]=Math.random()<th.gasCh?T.GAS:T.BARREL;
      else if(q<th.barrel+th.furn*fm)map[i]=T.FURN;
    }
    if(Math.random()<BAL.crateCh){const x=rndi(r.x0+1,r.x1-1),y=Math.random()<.5?r.y0+1:r.y1-1;if(map[x+y*MW]===T.FLOOR)items.push({k:pickCrate(),crate:true,x:x*TS+8,y:y*TS+8});}
  }
  for(const r of regions){ // редкие бочки в коридорах
    if(r.type!=='corr')continue;
    for(let k=0;k<2;k++)if(Math.random()<.35){const x=rndi(r.x0+1,r.x1-1),y=rndi(r.y0+1,r.y1-1),i=x+y*MW;
      if(map[i]===T.FLOOR&&(x===r.x0+1||y===r.y0+1)&&map[i-1]!==T.DOOR&&map[i+1]!==T.DOOR&&map[i-MW]!==T.DOOR&&map[i+MW]!==T.DOOR&&dStart[i]>8)map[i]=T.BARREL;}
  }
}
function genArena(n){ // этаж босса: большая арена, комната старта снизу, лестница в нише сверху
  const k=n/5-1;map.fill(T.HARD);
  const A={x0:9,y0:5,x1:62,y1:41,type:'room',id:0};regions.push(A);
  for(let y=A.y0+1;y<A.y1;y++)for(let x=A.x0+1;x<A.x1;x++)map[x+y*MW]=T.FLOOR;
  for(let y=42;y<=50;y++)for(let x=30;x<=41;x++)map[x+y*MW]=T.FLOOR;
  for(let x=34;x<=37;x++)map[x+41*MW]=T.FLOOR;
  for(let y=2;y<=4;y++)for(let x=33;x<=38;x++)map[x+y*MW]=T.FLOOR;
  map[35+5*MW]=T.FLOOR;map[36+5*MW]=T.FLOOR;
  for(let dy=0;dy<2;dy++)for(let dx=0;dx<2;dx++)map[35+dx+(2+dy)*MW]=T.STAIRS;
  F.sx=36*TS;F.sy=46*TS+8;F.stx=36*TS;F.sty=3*TS;F.bx=36*TS;F.by=22*TS;F.arena=A;
  const put=(x,y,t)=>{const i=x+y*MW;if(x>A.x0&&x<A.x1&&y>A.y0&&y<A.y1&&map[i]===T.FLOOR&&Math.hypot(x-35.5,y-22)>4.5&&!(y>35&&x>31&&x<40)&&!(y<9&&x>32&&x<39))map[i]=t;};
  const scatter=(t,cnt)=>{for(let c=0;c<cnt;c++)put(rndi(12,59),rndi(8,38),t);};
  const pillars=(t,list)=>{for(const q of list){put(q[0],q[1],t);put(q[0]+1,q[1],t);put(q[0],q[1]+1,t);put(q[0]+1,q[1]+1,t);}};
  switch(k){
    case 0:pillars(T.WALL,[[18,12],[27,12],[44,12],[53,12],[18,22],[53,22],[18,32],[27,32],[44,32],[53,32]]);scatter(T.FURN,14);scatter(T.BARREL,6);break;
    case 1:for(let a=0;a<28;a++){if(a%7>4)continue;const an=a/28*TAU;put(Math.round(35.5+Math.cos(an)*11),Math.round(22+Math.sin(an)*9),T.PART);}scatter(T.BARREL,9);scatter(T.FURN,8);break;
    case 2:for(let x=14;x<=57;x+=6)for(let y=10;y<=35;y+=8){put(x,y,T.FURN);put(x+1,y,T.FURN);}
      for(let x=20;x<=50;x+=10)for(let y=14;y<=30;y+=8){put(x,y,T.GLASS);put(x,y+1,T.GLASS);}scatter(T.GAS,12);scatter(T.BARREL,4);break;
    case 3:pillars(T.HARD,[[20,13],[50,13],[20,30],[50,30],[35,10],[35,33]]);scatter(T.BARREL,16);scatter(T.FURN,6);break;
    default:pillars(T.HARD,[[22,14],[48,14],[22,29],[48,29]]);pillars(T.WALL,[[30,10],[40,10],[30,33],[40,33],[14,22],[56,22]]);scatter(T.BARREL,10);scatter(T.GAS,7);scatter(T.FURN,10);
  }
  items.push({k:'ammo',crate:true,x:31*TS+8,y:43*TS+8},{k:'med',crate:true,x:40*TS+8,y:43*TS+8},{k:'gren',crate:true,x:31*TS+8,y:49*TS+8},
    {k:'ammo',crate:true,x:11*TS+8,y:7*TS+8},{k:'med',crate:true,x:60*TS+8,y:7*TS+8},{k:'ammo',crate:true,x:60*TS+8,y:39*TS+8},{k:'med',crate:true,x:11*TS+8,y:39*TS+8});
}
function genFloor(n){
  map.fill(T.WALL);region.fill(-1);seen.fill(0);thp.fill(0);regions=[];items=[];
  for(let i=0;i<MN;i++)tvar[i]=(Math.random()*256)|0;
  if(F.isBoss)genArena(n);else genRooms();
  for(let x=0;x<MW;x++){map[x]=T.HARD;map[x+(MH-1)*MW]=T.HARD;}
  for(let y=0;y<MH;y++){map[y*MW]=T.HARD;map[MW-1+y*MW]=T.HARD;}
  for(let i=0;i<MN;i++)thp[i]=TILE_HP[map[i]];
  calcDStart();renderMap();
  if(F.isBoss)revealAll();
}

/* =====================================================================
   9. ЧАСТИЦЫ, ТРУПЫ, ДЕКАЛИ (пулы объектов)
   типы частиц: 0 кровь, 1 искра, 2 дым/пыль, 3 гильза, 4 кусок, 5 обломок, 6 огонь, 7 вспышка
   ===================================================================== */
const PFRIC=[5,3,2,6,5,5,1,0];
const BLOODC=['#8a1010','#a01818','#6a0c0c','#b02020'];
function part(t,x,y,vx,vy,life,col,sz){if(pN>=MAXP)return;const p=parts[pN++];p.t=t;p.x=x;p.y=y;p.vx=vx;p.vy=vy;p.life=life;p.max=life;p.col=col;p.sz=sz;}
function updateParts(dt){
  for(let i=0;i<pN;i++){
    const p=parts[i];p.life-=dt;
    if(p.life<=0){
      if((p.t===0||p.t===3||p.t===4||p.t===5)&&!solidAt(p.x,p.y)){floorCtx.fillStyle=p.col;floorCtx.fillRect(p.x|0,p.y|0,p.sz,p.sz);} // остаётся на полу
      parts[i]=parts[--pN];parts[pN]=p;i--;continue;
    }
    p.x+=p.vx*dt;p.y+=p.vy*dt;const f=Math.max(0,1-PFRIC[p.t]*dt);p.vx*=f;p.vy*=f;
    if(p.t===0){if(solidAt(p.x,p.y)){wallCtx.fillStyle=p.col;wallCtx.fillRect(p.x|0,p.y|0,1,2);p.life=0;}} // брызги на стенах
    else if(p.t>=3&&p.t<=5&&solidAt(p.x,p.y)){p.vx=-p.vx*.4;p.vy=-p.vy*.4;p.x+=p.vx*dt*2;p.y+=p.vy*dt*2;}
  }
}
function drawParts(c){
  for(let i=0;i<pN;i++){
    const p=parts[i];if(p.t!==7&&!vis[tIdx(p.x,p.y)])continue; // вне поля зрения частицы не рисуются
    switch(p.t){
      case 2:{const k=p.life/p.max,s=p.sz*(1.8-k);c.globalAlpha=k*.45;c.fillStyle=p.col;c.fillRect(p.x-s/2,p.y-s/2,s,s);c.globalAlpha=1;break;}
      case 6:{const k=p.life/p.max,s=p.sz*(.5+k);c.fillStyle=k>.6?'#fff0a0':k>.3?'#ff9a20':'#c03010';c.fillRect(p.x-s/2,p.y-s/2,s,s);break;}
      case 7:{const s=p.sz*(p.life/p.max*.6+.4);c.globalCompositeOperation='lighter';c.drawImage(SPR.glow,p.x-s,p.y-s,s*2,s*2);c.globalCompositeOperation='source-over';break;}
      default:c.fillStyle=p.col;c.fillRect(p.x|0,p.y|0,p.sz,p.sz);
    }
  }
}
function debris(cx,cy,n,col,spd){for(let k=0;k<n;k++)part(5,cx+rnd(-5,5),cy+rnd(-5,5),rnd(-spd,spd),rnd(-spd,spd),rnd(.25,.6),shade(col,rnd(.6,1.1)),rndi(1,2));}
function dust(cx,cy,n){for(let k=0;k<n;k++)part(2,cx+rnd(-6,6),cy+rnd(-6,6),rnd(-14,14),rnd(-14,14),rnd(.5,1.1),'#a8a498',rnd(5,9));}
function blood(x,y,n,kx,ky){if(pN>MAXP*.7)n=1;for(let k=0;k<n;k++)part(0,x,y,kx*.25+rnd(-45,45),ky*.25+rnd(-45,45),rnd(.12,.4),pick(BLOODC),Math.random()<.3?2:1);}
function bloodSplat(x,y,r){for(let k=0;k<5+r;k++){floorCtx.fillStyle=pick(BLOODC);floorCtx.fillRect((x+rnd(-r-3,r+3))|0,(y+rnd(-r-3,r+3))|0,rndi(1,3),rndi(1,2));}}
function gibs(x,y,n,kx,ky){if(pN>MAXP*.7)n=Math.ceil(n/3);for(let k=0;k<n;k++)part(4,x,y,kx*.3+rnd(-90,90),ky*.3+rnd(-90,90),rnd(.3,.6),pick(['#7a1414','#9a2a1a','#5a0c0c','#86a860']),2);}
function bakeCorpse(spr,x,y,ang){
  if(solidAt(x,y))return;const im=SPR.c[spr];
  floorCtx.save();floorCtx.imageSmoothingEnabled=false;floorCtx.translate(x|0,y|0);floorCtx.rotate(ang);floorCtx.drawImage(im,-(im.width>>1),-(im.height>>1));floorCtx.restore();
}
function spawnCorpse(spr,x,y,vx,vy,ang){
  if(cN>=MAXC){bakeCorpse(spr,x,y,ang);return;}
  const c=corpses[cN++];c.spr=spr;c.x=x;c.y=y;c.vx=vx;c.vy=vy;c.ang=ang;c.t=rnd(.25,.45);
}
function updateCorpses(dt){
  const fr=Math.max(0,1-7*dt);
  for(let i=0;i<cN;i++){
    const c=corpses[i];c.t-=dt;moveEnt(c,c.vx*dt,c.vy*dt,3);c.vx*=fr;c.vy*=fr;
    if(c.t<=0){bakeCorpse(c.spr,c.x,c.y,c.ang);corpses[i]=corpses[--cN];corpses[cN]=c;i--;}
  }
}
function addShake(v){cam.shake=Math.min(8,Math.max(cam.shake,v)+v*.25);}
function noiseAt(x,y,r){if(r>noiseR){noiseR=r;noiseX=x;noiseY=y;}}
function say(text,dur,local){if(!F)return;F.msg=text;F.msgT=dur||2.5;if(!local)nev('m',text,F.msgT);} // local — только себе, не гостям

/* =====================================================================
   10. БОЙЦЫ И ОРУЖИЕ
   ===================================================================== */
function magOf(s,w){return Math.round(w.mag*(w.cls==='mg'&&s.cls==='mg'&&s.sk[0]?1.5:1));}
function resOf(s,w,st){if(w.res===Infinity)return Infinity;return Math.round(w.res*(1+BAL.ammoPerStat*st.ammo)*(w.cls==='ex'&&s.cls==='demo'&&s.sk[1]?1.5:1));}
function buildSquad(){
  squad=[];
  SQUAD_DEF.forEach((d,i)=>{
    const p=P.squad[i],st=p.st;
    const s={idx:i,name:d.name,cls:d.cls,color:d.color,isPlayer:i===0,sk:p.sk,
      x:F.sx+[0,-14,14,0][i],y:F.sy+[0,10,10,20][i],kx:0,ky:0,ang:-Math.PI/2,head:-Math.PI/2,
      maxHp:BAL.baseHp+st.hp*BAL.hpPerStat+(p.lvl-1)*BAL.hpPerLevel,hp:0,down:false,revive:0,downA:0,hurtT:0,touch:0,
      speed:(i===0?BAL.playerSpeed:BAL.botSpeed)*(1+BAL.spdPerStat*st.spd),sprMul:1-BAL.accPerStat*st.acc,relMul:1-BAL.relPerStat*st.rel,
      weapons:[],cur:0,pistol:null,fireT:0,reloadT:0,reloadMax:1,bloom:0,spin:0,trigger:false,aimDist:100,gr:[0,0,0],grType:0,
      cmd:'follow',gx:0,gy:0,secA:0,doorI:-1,rx:0,ry:0,holdFire:false,path:null,pathI:0,pathT:0,pathGoal:-1,target:null,thinkT:rnd(.2),wT:0,gT:rnd(2,5),
      moving:false,mvA:-Math.PI/2,stT:0,sx:0,sy:0,stuck:0,bark:'',barkT:0,blocked:0,strafe:1,
      flashT:0,lookA:null,vX:-999,vY:-999,vA:-999,vD:0};
    s.hp=s.maxHp;
    for(const id of p.w){if(!id||!WEAPONS[id])continue;const w=WEAPONS[id],mg=magOf(s,w),rs=resOf(s,w,st);s.weapons.push({id,mag:mg,max:mg,res:rs,resMax:rs});}
    s.pistol={id:'pistol',mag:12,max:12,res:Infinity,resMax:Infinity};
    if(!s.weapons.length)s.cur=-1;
    const g=st.gren+(d.cls==='demo'&&p.sk[1]?2:0);
    s.gr=i===0?[2+g,1+(g>>1),1+(g>>1)]:[1+g,0,0];
    if(solidAt(s.x,s.y)){s.x=F.sx;s.y=F.sy;}
    squad.push(s);
  });
  player=squad[0];
}
function curWS(s){return s.cur>=0&&s.weapons[s.cur]?s.weapons[s.cur]:s.pistol;}
function startReload(s){
  if(s.reloadT>0)return;const ws=curWS(s);if(ws.mag>=ws.max||ws.res<=0)return;
  s.reloadMax=WEAPONS[ws.id].reload*s.relMul;s.reloadT=s.reloadMax;s.spin=0;sfx('reload',volAt(s.x,s.y));
}
function spawnBullet(x,y,dx,dy,spd,life,dmg,knock,pierce,kind,owner,enemy){
  if(bN>=MAXB)return null;const b=bullets[bN++];
  b.x=x;b.y=y;b.dx=dx;b.dy=dy;b.spd=spd;b.life=life;b.dmg=dmg;b.knock=knock;b.pierce=pierce;b.kind=kind;b.owner=owner;b.last=null;b.enemy=enemy||false;b.blast=0; // enemy: true — монстры, 2 — выжившие
  return b;
}
function shoot(s,ws,w){
  ws.mag--;if(s.isPlayer)P.stats.shots++;
  nev('sh',s.idx,+s.ang.toFixed(3),ws.id,s.aimDist|0);
  const ca=Math.cos(s.ang),sa=Math.sin(s.ang);
  let mx=s.x+ca*10,my=s.y+sa*10;if(solidAt(mx,my)){mx=s.x+ca*3;my=s.y+sa*3;}
  let pel=w.pel,dmg=w.dmg,knock=w.knock,pierce=w.pierce;const sk=s.sk;
  if(w.cls==='sg'&&s.cls==='aslt'){if(sk[0])pel+=2;if(sk[1]){knock*=1.8;pierce+=1;}}
  if(w.cls==='mg'&&s.cls==='mg'&&sk[1]){pierce+=1;dmg*=1.15;}
  if(!s.isPlayer&&player.sk[0]&&dist(s,player)<130)dmg*=1.2;
  const spr=(w.spread+s.bloom)*s.sprMul+(s.isPlayer?0:.025);
  const kind=w.proj==='flame'?1:w.proj==='shell'?2:w.proj==='rocket'?3:0;
  for(let i=0;i<pel;i++){
    const a=s.ang+(Math.random()+Math.random()-1)*spr,v=w.spd*(kind===1?rnd(.7,1.1):rnd(.92,1.08));
    let life=w.range*rnd(.85,1.1);if(kind===2)life=clamp(s.aimDist-10,30,w.range);
    const b=spawnBullet(mx,my,Math.cos(a),Math.sin(a),v,life,dmg,knock,pierce,kind,s.idx,false);
    if(b&&w.blast)b.blast=w.blast;
  }
  s.bloom=Math.min(.25,s.bloom+w.bloom);
  if(w.flash){part(7,mx+ca*4,my+sa*4,0,0,.05,'',w.flash);s.flashT=.08;} // вспышка выстрела кратко освещает круг вокруг стрелка
  if(kind===0)part(3,s.x+ca*4,s.y+sa*4,-sa*rnd(30,70)+rnd(-15,15),ca*rnd(30,70)+rnd(-15,15),rnd(.3,.5),w.cls==='sg'?'#c03a2a':'#d8b040',1);
  const v=volAt(s.x,s.y);sfx(w.snd,s.isPlayer?1:v*.8);
  if(s.isPlayer){addShake(w.shake);cam.kx-=ca*w.kick;cam.ky-=sa*w.kick;}else addShake(w.shake*.2*v);
  noiseAt(s.x,s.y,BAL.noiseShot);
}
function updateWeapon(s,dt){
  const ws=curWS(s),w=WEAPONS[ws.id];
  if(s.fireT>0)s.fireT-=dt;
  s.bloom=Math.max(0,s.bloom-dt*.22);
  if(s.reloadT>0){
    s.reloadT-=dt;
    if(s.reloadT<=0){const n=Math.min(ws.max-ws.mag,ws.res);ws.mag+=n;if(ws.res!==Infinity)ws.res-=n;sfx('reload2',volAt(s.x,s.y));}
    return;
  }
  if(ws.mag<=0){
    if(ws.res>0){startReload(s);return;}
    s.cur=s.weapons.findIndex(x=>x.mag>0||x.res>0);s.fireT=.3;s.spin=0;return; // всё пусто — пистолет (cur=-1)
  }
  if(s.trigger){
    if(w.spin&&s.spin<w.spin){s.spin+=dt;if(s.isPlayer)sfx('spin');return;}
    let n=0;while(s.fireT<=0&&ws.mag>0&&n<3){shoot(s,ws,w);s.fireT+=1/w.rate;n++;}
    if(s.fireT<0)s.fireT=0;
  }else{
    if(s.spin>0)s.spin=Math.max(0,s.spin-dt*2);
    if(s.fireT<0)s.fireT=0;
  }
}
function addXp(i,xp){
  const p=P.squad[i];p.xp+=xp;
  while(p.xp>=BAL.xpForLevel(p.lvl)){p.xp-=BAL.xpForLevel(p.lvl);p.lvl++;p.sp++;if(state==='play'){say(SQUAD_DEF[i].name+': уровень '+p.lvl+'! +1 очко навыков',2.5);sfx('level');}}
}
function hurtSoldier(s,dmg,sx,sy){
  if(s.down||state!=='play'||dmg<=0)return;
  if(s.cls==='aslt'&&s.sk[2])dmg*=.7;
  if(!s.isPlayer&&!s.remote)dmg*=BAL.botDmgTaken; // сетевые игроки получают урон как командир
  s.hp-=dmg;s.hurtT=.25;blood(s.x,s.y,2,0,0);
  if(s.isPlayer){F.hurt=Math.min(1,F.hurt+dmg/22);addShake(1.5);sfx('hurt');}
  if(s.hp>0)return;
  if(s.isPlayer){
    if(s.sk[2]&&!F.secondWind){F.secondWind=true;s.hp=s.maxHp*.4;say('ВТОРОЕ ДЫХАНИЕ!',2.5);explode(s.x,s.y,64,90,0,{ff:0});}
    else{s.hp=0;gameOver();}
  }else{
    s.hp=0;s.down=true;s.revive=0;s.downA=rnd(TAU);s.trigger=false;s.target=null;s.path=null;
    say(s.name+' ранен! Удерживайте E рядом с ним',3.5);sfx('down');bloodSplat(s.x,s.y,6);
  }
}
function reviveBot(b){
  b.down=false;b.revive=0;b.hp=b.maxHp*(player.sk[1]?.7:BAL.reviveHp);b.cmd='follow';
  P.stats.revives++;sfx('revive');say(b.name+' снова в строю',2);bark(b,'Спасибо!');
}
function bark(s,t){s.bark=t;s.barkT=1.6;}

/* =====================================================================
   11. ПУЛИ, ВЗРЫВЫ, ГРАНАТЫ, ОПАСНЫЕ ЗОНЫ
   виды пуль: 0 пуля, 1 пламя, 2 граната ГП, 3 ракета, 4 кислота (враг), 5 заклёпка босса (враг)
   ===================================================================== */
function bulletWall(b,ti){
  const bx=b.x-b.dx*3,by=b.y-b.dy*3;
  switch(b.kind){
    case 0:{
      const gone=damageTile(ti,b.dmg*BAL.wallBulletMul);
      part(1,bx,by,-b.dx*60+rnd(-40,40),-b.dy*60+rnd(-40,40),rnd(.08,.18),'#ffe080',1);
      if(!gone){wallCtx.fillStyle='#161616';wallCtx.fillRect(b.x|0,b.y|0,1,1);} // след от пули
      if(Math.random()<.3)part(2,bx,by,rnd(-6,6),rnd(-6,6),.35,'#b0aca0',3);break;}
    case 1:damageTile(ti,.5);break;
    case 2:case 3:explode(bx,by,b.blast,b.dmg,b.owner,null);break;
    case 4:addHazard('acid',bx,by,9,3,-1);break;
    default:part(1,bx,by,rnd(-40,40),rnd(-40,40),.12,'#ffb060',1);damageTile(ti,b.dmg*.5);
  }
}
function updateBullets(dt){
  for(let i=0;i<bN;i++){
    const b=bullets[i];let dead=false;
    if(b.kind===1)b.spd*=Math.max(0,1-1.2*dt);
    else if(b.kind===3&&Math.random()<dt*60)part(2,b.x,b.y,rnd(-8,8),rnd(-8,8),.4,'#c8c8c8',3);
    const dd=b.spd*dt,steps=Math.max(1,Math.ceil(dd/5)),sl=dd/steps;
    for(let s=0;s<steps&&!dead;s++){
      b.x+=b.dx*sl;b.y+=b.dy*sl;b.life-=sl;
      const tx=b.x>>4,ty=b.y>>4;
      if(tx<1||ty<1||tx>=MW-1||ty>=MH-1){dead=true;break;}
      const ti=tx+ty*MW,t=map[ti];
      if(SOLID[t]){
        if(t===T.GLASS&&b.kind<2){if(NET.role!=='guest')destroyTile(ti);} // стекло разбивается, пуля летит дальше
        else{
          if(NET.role!=='guest')bulletWall(b,ti);
          else if(b.kind<2)part(1,b.x-b.dx*3,b.y-b.dy*3,-b.dx*60+rnd(-40,40),-b.dy*60+rnd(-40,40),rnd(.08,.18),'#ffe080',1);
          dead=true;break;
        }
      }
      if(NET.role==='guest'){ // у гостя пули — только картинка: гаснут о первую цель
        if(b.enemy){for(const so of squad)if(!so.down&&(so.x-b.x)*(so.x-b.x)+(so.y-b.y)*(so.y-b.y)<30){dead=true;break;}}
        else{
          const zi0=gridHead[ti];for(let zi=zi0;zi>=0;zi=gridNext[zi]){const z=zombies[zi];const rr=ZT[z.type].r+1.5;if((z.x-b.x)*(z.x-b.x)+(z.y-b.y)*(z.y-b.y)<rr*rr){if(b.kind<2)blood(z.x,z.y,1,b.dx*b.knock,b.dy*b.knock);dead=true;break;}}
          if(!dead&&boss&&!boss.dead&&distXY(boss,b.x,b.y)<boss.r+2)dead=true;
        }
        if(!dead&&b.enemy!==2)for(const v of survs)if(!v.dead&&(v.x-b.x)*(v.x-b.x)+(v.y-b.y)*(v.y-b.y)<30){if(b.kind<2)blood(v.x,v.y,1,0,0);dead=true;break;}
        if(!dead&&b.life<=0)dead=true;
        continue;
      }
      if(b.enemy){
        for(let k=0;k<squad.length;k++){
          const so=squad[k];if(so.down)continue;const ex=so.x-b.x,ey=so.y-b.y;
          if(ex*ex+ey*ey<30){hurtSoldier(so,b.dmg,b.x,b.y);if(b.kind===4)addHazard('acid',b.x,b.y,9,3,-1);dead=true;break;}
        }
        if(!dead&&b.enemy===true&&survN){ // кислота и снаряды монстров попадают и в выживших
          for(const v of survs){if(v.dead)continue;const ex=v.x-b.x,ey=v.y-b.y;if(ex*ex+ey*ey<30){hurtSurv(v,b.dmg,0,0,-3,false);if(b.kind===4)addHazard('acid',b.x,b.y,9,3,-1);dead=true;break;}}
        }
        if(!dead&&b.enemy===2){ // пули выживших косят и зомби
          for(let zi=gridHead[ti];zi>=0;zi=gridNext[zi]){
            const z=zombies[zi];if(z.dead)continue;const rr=ZT[z.type].r+1.5,ex=z.x-b.x,ey=z.y-b.y;
            if(ex*ex+ey*ey<rr*rr){hitZombie(z,b.dmg*1.5,b.dx*b.knock,b.dy*b.knock,-2,false);dead=true;break;}
          }
        }
      }else{
        let hit=null;
        for(let cy=ty-1;cy<=ty+1&&!hit;cy++)for(let cx=tx-1;cx<=tx+1&&!hit;cx++){
          let zi=gridHead[cx+cy*MW];
          while(zi>=0){
            const z=zombies[zi];zi=gridNext[zi];if(z.dead||z===b.last)continue;
            const rr=ZT[z.type].r+1.5,ex=z.x-b.x,ey=z.y-b.y;
            if(ex*ex+ey*ey<rr*rr){hit=z;break;}
          }
        }
        if(hit){
          if(b.kind>=2){explode(b.x,b.y,b.blast,b.dmg,b.owner,null);dead=true;}
          else{
            if(b.kind===1){hit.burn=Math.max(hit.burn,2.5);hit.burnBy=b.owner;}
            else{const o=squad[b.owner];if(o&&o.cls==='mg'&&o.sk[2])hit.slow=1.5;}
            hitZombie(hit,b.dmg,b.dx*b.knock,b.dy*b.knock,b.owner,false);
            if(b.pierce>0){b.pierce--;b.last=hit;if(b.kind===0)b.dmg*=.8;}else dead=true;
          }
        }else if(boss&&!boss.dead){
          const ex=boss.x-b.x,ey=boss.y-b.y,rr=boss.r+2;
          if(ex*ex+ey*ey<rr*rr){if(b.kind>=2)explode(b.x,b.y,b.blast,b.dmg,b.owner,null);else bossHit(b.dmg,b.dx,b.dy,false,b.owner);dead=true;}
        }
        if(!dead&&survN){ // пули отряда по враждебным выжившим
          for(const v of survs){
            if(v.dead||v===b.last)continue;const ex=v.x-b.x,ey=v.y-b.y;if(ex*ex+ey*ey>=30)continue;
            if(b.kind>=2){explode(b.x,b.y,b.blast,b.dmg,b.owner,null);dead=true;break;}
            hurtSurv(v,b.dmg,b.dx*b.knock,b.dy*b.knock,b.owner,false);
            if(b.pierce>0){b.pierce--;b.last=v;}else dead=true;
            break;
          }
        }
      }
      if(!dead&&b.life<=0){
        if(b.kind===2||b.kind===3)explode(b.x,b.y,b.blast,b.dmg,b.owner,null);
        else if(b.kind===4)addHazard('acid',b.x,b.y,9,3,-1);
        dead=true;
      }
    }
    if(dead){bullets[i]=bullets[--bN];bullets[bN]=b;i--;}
  }
}
function explode(x,y,r,dmg,owner,o){
  const own=owner>=0?squad[owner]:null,demo=own&&own.cls==='demo';
  if(demo&&own.sk[0])r*=1.25;
  const cum=demo&&own.sk[2]?1.5:1,enemy=!!(o&&o.enemy),ff=o&&o.ff!==undefined?o.ff:(enemy?1:BAL.ffOwn);
  if(dmg>0){
    const cx0=Math.max(0,(x-r-8)>>4),cx1=Math.min(MW-1,(x+r+8)>>4),cy0=Math.max(0,(y-r-8)>>4),cy1=Math.min(MH-1,(y+r+8)>>4);
    for(let cy=cy0;cy<=cy1;cy++)for(let cx=cx0;cx<=cx1;cx++){
      let zi=gridHead[cx+cy*MW];
      while(zi>=0){
        const z=zombies[zi];zi=gridNext[zi];if(z.dead)continue;
        const ex=z.x-x,ey=z.y-y,d=Math.hypot(ex,ey);
        if(d<r+ZT[z.type].r){const f=1-.7*d/(r+8),k=260*f/(d+1);hitZombie(z,dmg*f,ex*k,ey*k,owner,true);}
      }
    }
    if(boss&&!boss.dead){const d=distXY(boss,x,y);if(d<r+boss.r)bossHit(dmg*(1-.5*d/(r+boss.r))*cum,boss.x-x,boss.y-y,true,owner);}
    const tr=Math.ceil(r/TS),tx=x>>4,ty=y>>4;
    for(let yy=ty-tr;yy<=ty+tr;yy++)for(let xx=tx-tr;xx<=tx+tr;xx++){
      if(xx<1||yy<1||xx>=MW-1||yy>=MH-1)continue;const i=xx+yy*MW;if(!SOLID[map[i]])continue;
      const d=Math.hypot(xx*TS+8-x,yy*TS+8-y);if(d<r*.85+4)damageTile(i,dmg*(1-.55*d/r)*BAL.wallBlastMul*cum,1);
    }
    if(ff>0)for(const s of squad){
      if(s.down)continue;const d=distXY(s,x,y);
      if(d<r){hurtSoldier(s,dmg*(1-d/r)*ff,x,y);const k=140*(1-d/r)/(d+1);s.kx+=(s.x-x)*k;s.ky+=(s.y-y)*k;}
    }
    for(const v of survs){ // выживших тоже рвёт (своей гранатой — слабее)
      if(v.dead)continue;const d=distXY(v,x,y);
      if(d<r+4){const f=1-.6*d/(r+4),k=200*f/(d+1);hurtSurv(v,dmg*f*(o&&o.surv?.4:1),(v.x-x)*k,(v.y-y)*k,owner,true);}
    }
  }
  explodeFx(x,y,r);nev('ex',x|0,y|0,r|0);
}
function explodeFx(x,y,r){ // картинка и звук взрыва (общие для хоста и гостя)
  part(7,x,y,0,0,.14,'',r*1.6);addLight(x,y,r/TS+3,.35);
  const n=Math.min(22,(6+r/3)|0);
  for(let k=0;k<n;k++){const a=rnd(TAU),sp=rnd(20,r*3);part(6,x,y,Math.cos(a)*sp,Math.sin(a)*sp,rnd(.2,.5),'',rnd(3,6));}

function survTarget(s){ // отряд в поле зрения важнее зомби; спокойный выживший видит только перед собой

function updateSurvivors(dt){

      if(!s.tgZ&&BAL.survGren(F.n)>0){
        s.gT-=dt;

          s.gT=rnd(5,9);
          if(d>70&&d<170&&Math.random()<BAL.survGren(F.n)){const e=clipLine(s.x,s.y,tg.x+rnd(-12,12),tg.y+rnd(-12,12));lob(0,s.x,s.y,e.x,e.y,.35+d/320,-2);sfx('throw',volAt(s.x,s.y));}
        }

    }else if(s.group.alert&&s.hasL){ // идём туда, где последний раз видели/слышали отряд
      if(distXY(s,s.lx,s.ly)>18){gx=s.lx;gy=s.ly;want=true;}

}

const flowHeap=new Heap(MN*8),aHeap=new Heap(MN*8);
function computeFlow(){ // Дейкстра от всех бойцов; двери, стёкла и мебель проходимы «с ценой» — зомби их ломают; стены — нет
  zField.fill(INF);flowHeap.clear();
  for(const s of squad){if(s.down)continue;const i=tIdx(s.x,s.y);if(zField[i]!==0){zField[i]=0;flowHeap.push(0,i);}}
  while(flowHeap.n){
    const i=flowHeap.pop(),d=flowHeap.topK;if(d>zField[i])continue;
    const x=i%MW,y=(i/MW)|0,base=d+ZEXTRA[map[i]],si=SOLID[map[i]];
    for(let k=0;k<8;k++){
      const nx=x+DX[k],ny=y+DY[k];if(nx<1||ny<1||nx>=MW-1||ny>=MH-1)continue;
      const j=nx+ny*MW,t=map[j];if(ZBLOCK[t])continue;
      let c;if(k<4)c=base+10;else{if(si||SOLID[t]||SOLID[map[nx+y*MW]]||SOLID[map[x+ny*MW]])continue;c=base+14;}
      if(c<zField[j]){zField[j]=c;flowHeap.push(c,j);}
    }
  }
  navDirty=false;
}
const aG=new Int32Array(MN),aSt=new Uint32Array(MN),aFrom=new Int32Array(MN);let aStamp=0;
function findPath(si,gi){ // A* по тайлам, закрытые двери проходимы (бот их открывает)
  if(!passSquad(map[gi])){gi=nearFree(gi);if(gi<0)return null;}
  if(si===gi)return [];
  aStamp++;aHeap.clear();aG[si]=0;aSt[si]=aStamp;aFrom[si]=-1;aHeap.push(0,si);
  const gx=gi%MW,gy=(gi/MW)|0;let found=false,iter=0;
  while(aHeap.n&&iter++<9000){
    const i=aHeap.pop();if(i===gi){found=true;break;}
    const g=aG[i],x=i%MW,y=(i/MW)|0;
    for(let k=0;k<8;k++){
      const nx=x+DX[k],ny=y+DY[k];if(nx<1||ny<1||nx>=MW-1||ny>=MH-1)continue;
      const j=nx+ny*MW,t=map[j];if(!passSquad(t))continue;
      if(k>=4&&(SOLID[t]||SOLID[map[i]]||SOLID[map[nx+y*MW]]||SOLID[map[x+ny*MW]]))continue;
      const c=g+(k<4?10:14)+(t===T.DOOR?20:0);
      if(aSt[j]!==aStamp||c<aG[j]){aSt[j]=aStamp;aG[j]=c;aFrom[j]=i;const hx=Math.abs(nx-gx),hy=Math.abs(ny-gy);aHeap.push(c+10*Math.max(hx,hy)+4*Math.min(hx,hy),j);}
    }
  }
  if(!found)return null;
  const p=[];let i=gi;while(i!==si&&i>=0){p.push(i);i=aFrom[i];}p.reverse();return p;
}

function nearestSoldier(x,y){let b=null,bd=1e12;for(const s of squad){if(s.down)continue;const d=(s.x-x)*(s.x-x)+(s.y-y)*(s.y-y);if(d<bd){bd=d;b=s;}}return b;}
function updateZombies(fdt){
  for(let i=0;i<zN;i++){if(zombies[i].dead){const z=zombies[i];zombies[i]=zombies[--zN];zombies[zN]=z;i--;}} // уплотнение пула
  gridHead.fill(-1);
  for(let i=0;i<zN;i++){const z=zombies[i],c=tIdx(z.x,z.y);gridNext[i]=gridHead[c];gridHead[c]=i;}       // пространственная сетка
  for(const s of squad)s.touch=0;
  frameNo++;
  const dmgMul=F.dmgMul,lx0=cam.x-90,lx1=cam.x+VW+90,ly0=cam.y-90,ly1=cam.y+VH+90;
  for(let i=0;i<zN;i++){
    const z=zombies[i];if(z.dead)continue;const zt=ZT[z.type];
    z.acc+=fdt;
    // далёкие от камеры зомби обновляются раз в 3 кадра с накопленным шагом времени
    if((z.x<lx0||z.x>lx1||z.y<ly0||z.y>ly1)&&z.kx===0&&z.ky===0&&(i+frameNo)%3!==0)continue;
    const dt=z.acc,fr=Math.exp(-8*dt);z.acc=0;
    if(z.flash>0)z.flash-=dt;
    if(z.burn>0){
      z.burn-=dt;z.hp-=14*dt;
      if(Math.random()<dt*5)part(6,z.x+rnd(-2,2),z.y+rnd(-2,2),rnd(-8,8),rnd(-22,-6),.3,'',2);
      if(z.hp<=0){killZombie(z,0,0,z.burnBy,false);continue;}
    }
    if(z.kx!==0||z.ky!==0){moveEnt(z,z.kx*dt,z.ky*dt,zt.h);z.kx*=fr;z.ky*=fr;if(Math.abs(z.kx)+Math.abs(z.ky)<4){z.kx=0;z.ky=0;}}
    if(z.stun>0){z.stun-=dt;continue;}
    if(z.atk>0)z.atk-=dt;
    let mx=0,my=0,spd=zt.spd*z.sm;if(z.slow>0){z.slow-=dt;spd*=.55;}
    const ti=tIdx(z.x,z.y);
    z.dt-=dt;
    if(z.state===0){ // спит/бродит, пока не почует отряд
      if(z.dt<=0){z.dt=rnd(.3,.6);if(zField[ti]<80)z.state=1;}
      z.wt-=dt;if(z.wt<=0){z.wt=rnd(1,4);z.wm=Math.random()<.5?1:0;z.wa=rnd(-Math.PI,Math.PI);}
      if(z.wm){mx=Math.cos(z.wa);my=Math.sin(z.wa);spd*=.3;}
    }else{
      if(z.dt<=0){
        z.dt=rnd(.25,.45);let tg=nearestSoldier(z.x,z.y);z.direct=false;
        if(survN){ // враждебные выжившие тоже еда: ближайший из них может оказаться целью
          let bd=tg?(tg.x-z.x)*(tg.x-z.x)+(tg.y-z.y)*(tg.y-z.y):1e12;
          for(let k=0;k<survs.length;k++){const v=survs[k];if(v.dead)continue;const d2=(v.x-z.x)*(v.x-z.x)+(v.y-z.y)*(v.y-z.y);if(d2<bd&&d2<12544){bd=d2;tg=v;}}
        }
        z.tg=tg;
        if(tg){const ex=tg.x-z.x,ey=tg.y-z.y;if(ex*ex+ey*ey<12544&&walkLine(z.x,z.y,tg.x,tg.y,3))z.direct=true;}
      }
      const tg=z.tg;
      if(tg&&!tg.down&&!tg.dead&&z.direct){ // цель в прямой видимости — идём напрямую
        const ex=tg.x-z.x,ey=tg.y-z.y,d=Math.hypot(ex,ey)||1;
        if(z.type===Z_SPITTER&&d>36&&d<zt.spitRange){
          z.ang=Math.atan2(ey,ex);
          if(z.atk<=0){z.atk=zt.spitCd;spawnBullet(z.x,z.y,ex/d,ey/d,150,d+12,zt.spitDmg*dmgMul,0,0,4,-1,true);sfx('acid',volAt(z.x,z.y)*.6);}
        }else if(d<zt.r+7){
          if(z.type===Z_BOOMER){killZombie(z,0,0,-1,false);continue;}
          z.ang=Math.atan2(ey,ex);
          if(z.atk<=0){z.atk=zt.atk;if(tg.isSurv)hurtSurv(tg,zt.dmg*dmgMul*2,0,0,-3,false);else hurtSoldier(tg,zt.dmg*dmgMul,z.x,z.y);}
        }else{mx=ex/d;my=ey/d;}
      }else{ // иначе — по полю потоков
        let best=INF,bj=-1;
        for(let k=0;k<8;k++){
          const j=ti+DOFF[k];if(j<0||j>=MN)continue;const t=map[j];if(ZBLOCK[t])continue;
          let c=zField[j];if(c>=INF)continue;
          if(k<4)c+=10+ZEXTRA[t];else{if(SOLID[t]||SOLID[map[ti+DX[k]]]||SOLID[map[ti+DY[k]*MW]])continue;c+=14;}
          if(c<best){best=c;bj=j;}
        }
        if(bj>=0){
          const ex=tcx(bj)-z.x,ey=tcy(bj)-z.y,d=Math.hypot(ex,ey)||1;mx=ex/d;my=ey/d;
          if(SOLID[map[bj]]&&d<zt.r+11.5){ // упёрся в дверь/мебель/стекло — ломает
            mx=0;my=0;z.ang=Math.atan2(ey,ex);
            if(z.atk<=0){
              z.atk=zt.atk;damageTile(bj,zt.dmg*3);sfx('bang',volAt(z.x,z.y)*.7);
              if(!vis[ti])hearAt(z.x,z.y,1); // стук в дверь слышен и вне поля зрения
              if(Math.random()<.4)part(2,(z.x+tcx(bj))/2,(z.y+tcy(bj))/2,rnd(-6,6),rnd(-6,6),.4,'#a8a498',4);
            }
          }
        }
      }
    }
    // расталкивание соседей через сетку
    let qx=0,qy=0;const cx=z.x>>4,cy=z.y>>4;
    for(let yy=cy-1;yy<=cy+1;yy++){
      if(yy<0||yy>=MH)continue;
      for(let xx=cx-1;xx<=cx+1;xx++){
        if(xx<0||xx>=MW)continue;let j=gridHead[xx+yy*MW];
        while(j>=0){
          if(j!==i){const o=zombies[j];if(!o.dead){const ex=z.x-o.x,ey=z.y-o.y,rr=zt.r+ZT[o.type].r,d2=ex*ex+ey*ey;
            if(d2<rr*rr&&d2>.0001){const d=Math.sqrt(d2),f=(rr-d)/d*.5;qx+=ex*f;qy+=ey*f;}}}
          j=gridNext[j];
        }
      }
    }
    for(let k=0;k<squad.length;k++){
      const s=squad[k];if(s.down)continue;const ex=z.x-s.x,ey=z.y-s.y,rr=zt.r+4,d2=ex*ex+ey*ey;
      if(d2<rr*rr&&d2>.0001){const d=Math.sqrt(d2),f=(rr-d)/d;qx+=ex*f;qy+=ey*f;s.touch++;}
    }
    if(survN)for(let k=0;k<survs.length;k++){ // и не проходят сквозь выживших
      const v=survs[k];if(v.dead)continue;const ex=z.x-v.x,ey=z.y-v.y;if(ex>12||ex<-12||ey>12||ey<-12)continue;
      const rr=zt.r+4,d2=ex*ex+ey*ey;if(d2<rr*rr&&d2>.0001){const d=Math.sqrt(d2),f=(rr-d)/d;qx+=ex*f;qy+=ey*f;}
    }
    const ql=Math.hypot(qx,qy);if(ql>2.5){qx*=2.5/ql;qy*=2.5/ql;}
    const vx=mx*spd*dt+qx*.6,vy=my*spd*dt+qy*.6,bx=z.x,by=z.y;
    if(vx!==0||vy!==0)moveEnt(z,vx,vy,zt.h);
    if(mx!==0||my!==0){
      slideAssist(z,mx,my,bx,by,spd*dt,zt.h); // не застревать на углах и в дверных проёмах
      z.ang+=angDiff(z.ang,Math.atan2(my,mx))*Math.min(1,dt*10);
      if(z.ang>Math.PI)z.ang-=TAU;else if(z.ang<-Math.PI)z.ang+=TAU;
      z.anim+=dt*(2+spd*.12);
    }
  }
}

const FORM=[[-16,-13],[-16,13],[-30,0]],MOVE_OFF=[[0,0],[-14,10],[14,10]];
const LOOK_OFF=[-1.25,1.25,Math.PI]; // в строю боты смотрят влево, вправо и назад относительно взгляда командира
function crowdAt(x,y,r){
  let n=0;const cx0=Math.max(0,(x-r)>>4),cx1=Math.min(MW-1,(x+r)>>4),cy0=Math.max(0,(y-r)>>4),cy1=Math.min(MH-1,(y+r)>>4);
  for(let cy=cy0;cy<=cy1;cy++)for(let cx=cx0;cx<=cx1;cx++){let zi=gridHead[cx+cy*MW];while(zi>=0){const z=zombies[zi];zi=gridNext[zi];if(!z.dead&&distXY(z,x,y)<r&&++n>=8)return n;}}
  return n;
}
function allyNear(x,y,r,self){for(const s of squad)if(s!==self&&distXY(s,x,y)<r)return true;return false;}
function allyInLine(s,ex,ey,d,spread){ // есть ли свой на линии огня
  for(const o of squad){
    if(o===s||o.down)continue;
    const ox=o.x-s.x,oy=o.y-s.y,t=(ox*ex+oy*ey)/(d*d);if(t<=0||t>1.08)continue;
    const px_=ox-ex*t,py_=oy-ey*t;if(Math.hypot(px_,py_)<7+t*d*spread)return true;
  }
  return false;
}
const ptZ=[null,null,null,null,null,null],ptD=new Float32Array(6);
function pickTarget(s){ // ближайшая угроза, которую видит кто-то из отряда; поиск идёт по пространственной сетке
  let range=170;for(const ws of s.weapons)range=Math.max(range,Math.min(260,WEAPONS[ws.id].range*.9));
  const r2=range*range,def=s.cmd==='defend';let n=0;
  const cx0=Math.max(0,(s.x-range)>>4),cx1=Math.min(MW-1,(s.x+range)>>4),cy0=Math.max(0,(s.y-range)>>4),cy1=Math.min(MH-1,(s.y+range)>>4);
  for(let cy=cy0;cy<=cy1;cy++)for(let cx=cx0;cx<=cx1;cx++){
    const c=cx+cy*MW;if(!vis[c])continue; // клетку никто не видит — целей там «нет»
    let zi=gridHead[c];
    while(zi>=0){
      const z=zombies[zi];zi=gridNext[zi];if(z.dead)continue;
      const ex=z.x-s.x,ey=z.y-s.y,d2=ex*ex+ey*ey;if(d2>r2)continue;
      if(def&&d2>2500&&Math.abs(angDiff(s.secA,Math.atan2(ey,ex)))>1.05)continue;
      if(n===6&&d2>=ptD[5])continue;
      let k=n<6?n++:5;while(k>0&&ptD[k-1]>d2){ptD[k]=ptD[k-1];ptZ[k]=ptZ[k-1];k--;}ptD[k]=d2;ptZ[k]=z;
    }
  }
  let zt=null;
  for(let k=0;k<n;k++){const z=ptZ[k];if(losShot(s.x,s.y,z.x,z.y)){zt=z;break;}}
  if(survN){ // вооружённые выжившие опаснее зомби — приоритет, если не сильно дальше
    let sb=null,sd=r2;
    for(const v of survs){
      if(v.dead)continue;const ex=v.x-s.x,ey=v.y-s.y,d2=ex*ex+ey*ey;if(d2>=sd||!vis[tIdx(v.x,v.y)])continue;
      if(def&&d2>2500&&Math.abs(angDiff(s.secA,Math.atan2(ey,ex)))>1.05)continue;
      if(!losShot(s.x,s.y,v.x,v.y))continue;sd=d2;sb=v;
    }
    if(sb&&(!zt||Math.sqrt(sd)<dist(s,zt)+60))zt=sb;
  }
  if(boss&&!boss.dead&&boss.st!=='idle'&&bossVisible()){
    const bd=dist(s,boss);
    if(bd<300&&(!zt||dist(s,zt)>70)&&losShot(s.x,s.y,boss.x,boss.y)&&(!def||Math.abs(angDiff(s.secA,Math.atan2(boss.y-s.y,boss.x-s.x)))<1.05))return boss;
  }
  return zt;
}
function botWeapon(s,tg,d){ // выбор оружия под дистанцию и толпу
  let best=-1,bs=0;
  for(let i=0;i<s.weapons.length;i++){
    const ws=s.weapons[i];if(ws.mag<=0&&ws.res<=0)continue;const w=WEAPONS[ws.id];let sc;
    if(w.cls==='ex'){if(d<w.blast+30||allyNear(tg.x,tg.y,w.blast+24,s))continue;sc=(tg.isBoss||crowdAt(tg.x,tg.y,w.blast)>=3)?5:.15;}
    else if(w.cls==='sg')sc=d<100?4:d<w.range?1.5:.2;
    else if(w.cls==='fl')sc=d<80?4.5:.1;
    else sc=d>90?3:2.2;
    if(i===s.cur)sc*=1.3;
    if(sc>bs){bs=sc;best=i;}
  }
  return best;
}
function botMove(s,gx,gy,dt){
  const sp=s.speed*(s.cmd==='follow'&&dist(s,player)>110?1.3:1);
  let tx=gx,ty=gy;
  if(!walkLine(s.x,s.y,gx,gy,4)){
    const gt=tIdx(gx,gy);s.pathT-=dt;
    if(!s.path||s.pathGoal!==gt||s.pathT<=0){s.path=findPath(tIdx(s.x,s.y),gt);s.pathGoal=gt;s.pathI=0;s.pathT=rnd(.5,.8);}
    const p=s.path;
    if(p&&p.length){
      while(s.pathI<p.length-1&&distXY(s,tcx(p[s.pathI]),tcy(p[s.pathI]))<4)s.pathI++;
      if(s.pathI<p.length-1){const n=p[s.pathI+1];if(walkLine(s.x,s.y,tcx(n),tcy(n),4))s.pathI++;}
      const n=p[s.pathI];tx=tcx(n);ty=tcy(n);
      if(map[n]===T.DOOR&&distXY(s,tx,ty)<22)openDoor(n);
    }
  }else s.path=null;
  const dx=tx-s.x,dy=ty-s.y,d=Math.hypot(dx,dy);
  if(d>.5){const st=Math.min(d,sp*dt);moveEnt(s,dx/d*st,dy/d*st,4);s.mvA=Math.atan2(dy,dx);}
  s.stT+=dt;
  if(s.stT>.6){ // защита от застревания
    if(Math.hypot(s.x-s.sx,s.y-s.sy)<2){
      s.stuck++;s.path=null;moveEnt(s,rnd(-3,3),rnd(-3,3),4);
      if(s.stuck>7&&s.cmd==='follow'){s.x=player.x;s.y=player.y;s.stuck=0;}
    }else s.stuck=0;
    s.sx=s.x;s.sy=s.y;s.stT=0;
  }
}
function updateBot(s,dt){
  if(s.barkT>0)s.barkT-=dt;if(s.hurtT>0)s.hurtT-=dt;
  if(s.down){s.trigger=false;return;}
  if(s.kx!==0||s.ky!==0){moveEnt(s,s.kx*dt,s.ky*dt,4);const f=Math.exp(-8*dt);s.kx*=f;s.ky*=f;if(Math.abs(s.kx)+Math.abs(s.ky)<3){s.kx=0;s.ky=0;}}
  s.thinkT-=dt;if(s.thinkT<=0){s.thinkT=rnd(.1,.18);s.target=pickTarget(s);}
  let tg=s.target;if(tg&&tg.dead){tg=null;s.target=null;}
  // --- движение по текущей команде ---
  let gx=s.x,gy=s.y,want=false;
  if(s.cmd==='follow'){
    const o=FORM[s.idx-1],ca=Math.cos(player.head),sa=Math.sin(player.head);
    gx=player.x+o[0]*ca-o[1]*sa;gy=player.y+o[0]*sa+o[1]*ca;
    let slot=true;if(solidAt(gx,gy)||!walkLine(player.x,player.y,gx,gy,4)){gx=player.x;gy=player.y;slot=false;}
    const d=distXY(s,gx,gy);
    if(s.moving){if(d<(slot?4:20))s.moving=false;}else if(d>(slot?10:28))s.moving=true;
    want=s.moving;
  }else if(s.cmd==='move'){
    if(distXY(s,s.gx,s.gy)>4){gx=s.gx;gy=s.gy;want=true;}else s.cmd='hold';
  }else if(s.cmd==='door'){
    if(map[s.doorI]!==T.DOOR){s.cmd='move';s.gx=s.rx;s.gy=s.ry;}
    else if(distXY(s,tcx(s.doorI),tcy(s.doorI))<21){openDoor(s.doorI);bark(s,'Открыто!');s.cmd='move';s.gx=s.rx;s.gy=s.ry;s.path=null;}
    else{gx=s.gx;gy=s.gy;want=true;}
  }
  if(s.blocked>0){
    s.blocked-=dt;
    if(!want&&s.cmd==='follow'&&tg){const a=s.ang+Math.PI/2*s.strafe;moveEnt(s,Math.cos(a)*s.speed*.6*dt,Math.sin(a)*s.speed*.6*dt,4);} // шаг в сторону, чтобы не стрелять сквозь своих
  }
  if(want)botMove(s,gx,gy,dt);else{s.path=null;s.stuck=0;s.stT=0;s.sx=s.x;s.sy=s.y;}
  // --- прицеливание и огонь ---
  s.trigger=false;
  if(tg){
    const ex=tg.x-s.x,ey=tg.y-s.y,d=Math.hypot(ex,ey)||1;
    s.wT-=dt;
    if(s.wT<=0&&s.reloadT<=0){s.wT=.45;const k=botWeapon(s,tg,d);if(k!==s.cur){s.cur=k;s.fireT=Math.max(s.fireT,.25);s.spin=0;}}
    const w=WEAPONS[curWS(s).id],df=angDiff(s.ang,Math.atan2(ey,ex));
    s.ang+=clamp(df,-10*dt,10*dt);s.aimDist=d;
    let can=!s.holdFire&&Math.abs(df)<(w.cls==='sg'||w.cls==='fl'?.22:.1)&&d<w.range*.95;
    if(can&&w.cls==='ex'&&(d<w.blast+28||allyNear(tg.x,tg.y,w.blast+24,s)))can=false;
    if(can&&allyInLine(s,ex,ey,d,w.spread+.04)){can=false;if(s.blocked<=0){s.blocked=.5;s.strafe=Math.random()<.5?1:-1;}}
    s.trigger=can;
    s.gT-=dt;
    if(s.gT<=0){
      s.gT=1;
      if(!s.holdFire&&s.gr[0]>0&&d>75&&d<170&&crowdAt(tg.x,tg.y,40)>=6&&!allyNear(tg.x,tg.y,GRENADES[0].r+26,null)&&losShot(s.x,s.y,tg.x,tg.y)){
        throwGrenade(s,tg.x,tg.y,0);bark(s,'Граната!');s.gT=7;
      }
    }
  }else{
    // куда смотреть без цели: приказ «смотреть туда» → сектор обороны → в строю веером (фланги и тыл) → по ходу движения
    const ta=s.lookA!==null?s.lookA:s.cmd==='defend'?s.secA:s.cmd==='follow'?player.ang+LOOK_OFF[s.idx-1]:(want?s.mvA:s.ang);
    s.ang+=clamp(angDiff(s.ang,ta),-6*dt,6*dt);
    const ws=curWS(s);if(ws.mag<ws.max*.5&&ws.res>0)startReload(s);
  }
}
function selList(){return (selBot>0?[squad[selBot]]:squad.slice(1)).filter(s=>!s.down&&!s.remote);} // живыми игроками не командуют
function issue(cmd){
  const list=selList();if(!list.length){sfx('deny');return;}
  F.tutCmd=true;
  if(cmd!=='fire'&&cmd!=='look')for(const s of list)s.lookA=null; // новый приказ отменяет «смотреть туда»
  switch(cmd){
    case 'look':for(const s of list)s.lookA=Math.atan2(mouse.wy-s.y,mouse.wx-s.x);F.mark={x:mouse.wx,y:mouse.wy,t:1.5};bark(list[0],'Смотрю туда!');break;
    case 'follow':for(const s of list){s.cmd='follow';s.path=null;s.moving=true;}bark(list[0],'За тобой!');break;
    case 'hold':for(const s of list){s.cmd='hold';s.path=null;}bark(list[0],'Стоим!');break;
    case 'move':{
      let gi=tIdx(mouse.wx,mouse.wy),bx=mouse.wx,by=mouse.wy;
      if(SOLID[map[gi]]||!boxFree(bx,by,4)){if(SOLID[map[gi]])gi=nearFree(gi);if(gi<0){say('Точка недоступна',1.5,true);sfx('deny');return;}bx=tcx(gi);by=tcy(gi);}
      list.forEach((s,k)=>{const o=MOVE_OFF[k];let x=bx+o[0],y=by+o[1];if(!boxFree(x,y,4)||!walkLine(bx,by,x,y,4)){x=bx;y=by;}s.cmd='move';s.gx=x;s.gy=y;s.path=null;});
      F.mark={x:bx,y:by,t:1.5};bark(list[0],'Выдвигаюсь!');break;}
    case 'defend':{ // сектора делятся по кругу: первый боец смотрит на курсор, остальные прикрывают фланги и тыл
      let cx=0,cy=0;for(const s of list){cx+=s.x;cy+=s.y;}cx/=list.length;cy/=list.length;
      const n=list.length,base=Math.atan2(mouse.wy-cy,mouse.wx-cx);
      list.forEach((s,k)=>{s.cmd='defend';s.path=null;s.secA=n===1?Math.atan2(mouse.wy-s.y,mouse.wx-s.x):base+k*TAU/n;});
      bark(list[0],'Держу сектор!');if(n>1)bark(list[n-1],'Прикрываю тыл!');break;}
    case 'door':{
      const ct=tIdx(mouse.wx,mouse.wy),cx=ct%MW,cy=(ct/MW)|0;let di=-1,bd=40;
      for(let y=cy-2;y<=cy+2;y++)for(let x=cx-2;x<=cx+2;x++){
        if(x<1||y<1||x>=MW-1||y>=MH-1)continue;const i=x+y*MW;if(map[i]!==T.DOOR)continue;
        const d=Math.hypot(tcx(i)-mouse.wx,tcy(i)-mouse.wy);if(d<bd){bd=d;di=i;}
      }
      if(di<0){say(TOUCH.on?'Направьте прицел на закрытую дверь':'Наведите курсор на закрытую дверь',1.8,true);sfx('deny');return;}
      let op=list[0];for(const s of list)if(distXY(s,tcx(di),tcy(di))<distXY(op,tcx(di),tcy(di)))op=s;
      let st=-1,sd=1e9;for(let k=0;k<4;k++){const j=di+DOFF[k];if(SOLID[map[j]])continue;const d=distXY(op,tcx(j),tcy(j));if(d<sd){sd=d;st=j;}}
      if(st<0){sfx('deny');return;}
      op.cmd='door';op.doorI=di;op.gx=tcx(st);op.gy=tcy(st);op.rx=op.x;op.ry=op.y;op.path=null;bark(op,'Открываю!');
      for(const s of list)if(s!==op){s.cmd='defend';s.secA=Math.atan2(tcy(di)-s.y,tcx(di)-s.x);bark(s,'Прикрываю!');}
      F.mark={x:tcx(di),y:tcy(di),t:1.5};break;}
    case 'fire':{const v=!list[0].holdFire;for(const s of list)s.holdFire=v;say(v?'Приказ: НЕ СТРЕЛЯТЬ':'Приказ: ОГОНЬ ПО ГОТОВНОСТИ',1.6,true);break;}
  }
  sfx('cmd');
}

/* =====================================================================
   16. БОССЫ
   ===================================================================== */
function spawnBoss(k){
  const d=BOSSES[k];
  boss={k,name:d.name,isBoss:true,x:F.bx,y:F.by,r:d.r,hp:d.hp,maxHp:d.hp,ang:Math.PI/2,st:'idle',t:2.5,phase:1,
    cd:3,cd2:6,cd3:10,cd4:8,cdN:5,stunT:1.6,swingDmg:28,crack:0,flash:0,dead:false,anim:0,chain:0,shell:false,hitM:0,n:0,sp:0,sT:0,sDir:1,alt:0,rooted:false,home:{x:F.bx,y:F.by}};
}
function bossTurn(b,ta,rate,dt){b.ang+=clamp(angDiff(b.ang,ta),-rate*dt,rate*dt);}
function bossWalk(b,ang,spd,dt){
  const ca=Math.cos(ang),sa=Math.sin(ang),ox=b.x,oy=b.y;moveEnt(b,ca*spd*dt,sa*spd*dt,8);
  if(Math.abs(b.x-ox)+Math.abs(b.y-oy)<spd*dt*.5){ // упёрся — крушит преграду
    for(let k=-1;k<=1;k++){const i=tIdx(b.x+ca*15-sa*k*7,b.y+sa*15+ca*k*7);if(SOLID[map[i]])damageTile(i,300*dt,2);}
  }
}
function bossAdds(type,n){ // подкрепление вылезает из-под пола арены — вразброс, не одной кучей
  const A=F.arena;let c=0;n=Math.min(n*BAL.spawnMul,BAL.maxAlive-zAlive);
  for(let t=0;t<n*14&&c<n;t++){
    const x=rndi(A.x0+1,A.x1-1),y=rndi(A.y0+1,A.y1-1);if(SOLID[map[x+y*MW]])continue;
    const wx=x*TS+8,wy=y*TS+8;let ok=distXY(boss,wx,wy)>50;
    for(const s of squad)if(distXY(s,wx,wy)<110){ok=false;break;}
    if(!ok)continue;
    const z=spawnZombie(type<0?rollType():type,wx+rnd(-4,4),wy+rnd(-4,4),true);if(z){c++;dust(wx,wy,2);}
  }
  if(c)sfx('groan');
}
function acidRing(b,n){
  const a0=rnd(TAU);
  for(let k=0;k<n;k++){const a=a0+k/n*TAU;spawnBullet(b.x+Math.cos(a)*(b.r+2),b.y+Math.sin(a)*(b.r+2),Math.cos(a),Math.sin(a),105,210,7,0,0,4,-1,true);}
  sfx('acid',.8);
}
function bossShock(b,r,dmg){
  for(const s of squad){if(s.down)continue;const d=dist(s,b);if(d<r+b.r){hurtSoldier(s,dmg,b.x,b.y);const k=260/(d+1);s.kx+=(s.x-b.x)*k;s.ky+=(s.y-b.y)*k;}}
  for(let k=0;k<18;k++){const a=k/18*TAU;part(2,b.x+Math.cos(a)*b.r,b.y+Math.sin(a)*b.r,Math.cos(a)*70,Math.sin(a)*70,.5,'#b8b4a8',6);}
  addShake(4);sfx('explosion',.45);
}
function bossCharge(b,dt){
  const ca=Math.cos(b.ang),sa=Math.sin(b.ang);let left=330*dt,stop=false;b.t-=dt;
  while(left>0&&!stop){
    const st=Math.min(4,left);left-=st;const nx=b.x+ca*st,ny=b.y+sa*st;
    for(let k=-1;k<=1;k++){
      const i=tIdx(nx+ca*10-sa*k*8,ny+sa*10+ca*k*8),t=map[i];
      if(t===T.HARD){stop=true;break;}
      if(SOLID[t]){damageTile(i,9999,2);addShake(2);} // таран босса проламывает стены и мебель
    }
    if(stop)break;b.x=nx;b.y=ny;
    for(const s of squad){
      if(s.down||((b.hitM>>s.idx)&1))continue;
      if(dist(s,b)<b.r+6){b.hitM|=1<<s.idx;hurtSoldier(s,36,b.x,b.y);s.kx+=ca*240-sa*90;s.ky+=sa*240+ca*90;}
    }
  }
  if(Math.random()<dt*40)part(2,b.x-ca*b.r,b.y-sa*b.r,rnd(-10,10),rnd(-10,10),.5,'#a8a498',6);
  if(stop){
    b.st='stun';b.t=b.stunT;b.cd=b.cdN;addShake(6);sfx('explosion',.5);
    dust(b.x+ca*b.r,b.y+sa*b.r,8);debris(b.x+ca*b.r,b.y+sa*b.r,8,'#4f5861',90);say(b.name+' оглушён — бейте!',1.8);return;
  }
  if(b.t<=0){if(b.chain>0){b.chain--;b.st='wind';b.t=.5;}else{b.st='chase';b.cd=b.cdN;}}
}
function bossCommon(b,tg,d,ta,dt){ // общие состояния: удар, замах, рывок, восстановление
  switch(b.st){
    case 'rec':b.t-=dt;if(b.t<=0)b.st='chase';return true;
    case 'swing':
      b.t-=dt;
      if(b.t<=0){
        for(const s of squad){
          if(s.down)continue;
          if(dist(s,b)<b.r+26&&Math.abs(angDiff(b.ang,Math.atan2(s.y-b.y,s.x-b.x)))<1.2){hurtSoldier(s,b.swingDmg,b.x,b.y);s.kx+=Math.cos(b.ang)*200;s.ky+=Math.sin(b.ang)*200;}
        }
        for(let k=0;k<8;k++){const a=b.ang+rnd(-1.1,1.1);part(1,b.x+Math.cos(a)*(b.r+10),b.y+Math.sin(a)*(b.r+10),Math.cos(a)*60,Math.sin(a)*60,.2,'#e8e8f0',2);}
        sfx('bang');addShake(2);b.st='rec';b.t=.5;
      }
      return true;
    case 'wind':bossTurn(b,ta,b.t>.25?5:0,dt);b.t-=dt;if(b.t<=0){b.st='charge';b.t=1.4;b.hitM=0;sfx('boss',.6);}return true;
    case 'charge':bossCharge(b,dt);return true;
  }
  return false;
}
function bossButcher(b,tg,d,ta,dt){ // Мясник: тесак и таран, ломающий стены
  const ph=b.phase,df=Math.abs(angDiff(b.ang,ta));
  bossTurn(b,ta,3,dt);if(df<1.2&&d>b.r+10)bossWalk(b,b.ang,BOSSES[0].spd*(1+.25*(ph-1)),dt);
  if(d<b.r+18&&df<.9){b.st='swing';b.t=.45;b.swingDmg=28;}
  else if(b.cd<=0&&d>60){b.st='wind';b.t=ph===3?.6:.9;b.chain=ph===3?1:0;b.cdN=[6,4.5,3.2][ph-1];b.stunT=ph===3?1.3:1.8;sfx('boss',.5);}
  if(ph>=2&&b.cd2<=0){b.cd2=14;bossAdds(Z_RUNNER,6+ph*2);}
}
function bossHive(b,tg,d,dt,lvl){ // Матка: порождает зомби под панцирем, уязвима в паузах
  if(b.st==='chase'){b.st='spawn';b.t=7;b.sp=0;}
  b.shell=b.st==='spawn';
  if(b.st==='spawn'){
    b.t-=dt;b.sp-=dt;
    let guard=0;if(b.sp<-.2)b.sp=-.2;
    while(b.sp<=0&&guard++<5&&zAlive<BAL.spawnMul*(110+40*lvl)&&zN<MAXZ-5){ // порождает втрое чаще, чем раньше
      b.sp+=[.32,.24,.17][lvl-1]/BAL.spawnMul;const a=rnd(TAU),r=Math.random();
      const ty=lvl>=3&&r<.1?Z_BOOMER:lvl>=2&&r<.35?Z_RUNNER:r<.65?Z_CRAWLER:Z_WALKER;
      const z=spawnZombie(ty,b.x+Math.cos(a)*(b.r+4),b.y+Math.sin(a)*(b.r+4),true);
      if(z){z.kx=Math.cos(a)*rnd(110,190);z.ky=Math.sin(a)*rnd(110,190);part(0,z.x,z.y,Math.cos(a)*40,Math.sin(a)*40,.3,'#b05a6a',2);}
    }
    if(lvl>=2&&b.cd<=0){b.cd=2.4;acidRing(b,8+lvl*2);}
    if(b.t<=0){b.st='rest';b.t=[5.5,5,4.5][lvl-1];b.shell=false;say(b.name+': панцирь раскрыт — ОГОНЬ!',2);sfx('boss',.5);}
  }else if(b.st==='rest'){b.t-=dt;if(b.t<=0){b.st='spawn';b.t=6+lvl;b.shell=true;}}
  if(d<b.r+28&&b.cd2<=0){b.cd2=1.6;bossShock(b,30,16);}
}
function bossChemist(b,tg,d,ta,dt){ // Химик: кислотные лужи и газ, держит дистанцию
  const ph=b.phase;b.ang=ta;
  b.sT-=dt;if(b.sT<=0){b.sT=rnd(1.5,3);b.sDir=Math.random()<.5?1:-1;}
  const ma=d<85?ta+Math.PI:d>150?ta:ta+b.sDir*Math.PI/2;
  bossWalk(b,ma,BOSSES[2].spd*(1+.15*(ph-1)),dt);
  if(b.cd<=0){b.cd=[1.7,1.3,1.0][ph-1];b.alt^=1;lob(b.alt?3:4,b.x,b.y,tg.x+rnd(-16,16),tg.y+rnd(-16,16),.9,-1);sfx('throw',.8);}
  if(ph>=2&&b.cd2<=0){ // телепорт в облаке газа и веер колб
    b.cd2=9;addHazard('gas',b.x,b.y,30,6,-1);const A=F.arena;
    for(let t=0;t<40;t++){
      const x=rndi(A.x0+2,A.x1-2)*TS+8,y=rndi(A.y0+2,A.y1-2)*TS+8;if(!boxFree(x,y,8))continue;
      let ok=true;for(const s of squad)if(!s.down&&distXY(s,x,y)<110){ok=false;break;}
      if(ok){b.x=x;b.y=y;break;}
    }
    dust(b.x,b.y,8);sfx('acid');
    for(let k=-2;k<=2;k++){const a=Math.atan2(tg.y-b.y,tg.x-b.x)+k*.3,dd=Math.min(170,dist(tg,b));lob(k&1?4:3,b.x,b.y,b.x+Math.cos(a)*dd,b.y+Math.sin(a)*dd,1,-1);}
  }
  if(ph>=3&&b.cd3<=0){ // кислотный дождь по всему отряду
    b.cd3=13;say('ХИМИК заливает арену!',2);
    for(let k=0;k<9;k++){const s=pick(squad);lob(3,s.x+rnd(-60,60),s.y-140,s.x+rnd(-55,55),s.y+rnd(-55,55),1.1+k*.08,-1);}
    bossAdds(Z_SPITTER,4);
  }
}
function bossArmored(b,tg,d,ta,dt){ // Бронированный: уязвим со спины или после взрыва
  const ph=b.phase,df=angDiff(b.ang,ta);
  switch(b.st){
    case 'chase':
      bossTurn(b,ta,[1.0,1.3,1.6][ph-1],dt);
      if(Math.abs(df)<.9&&d>b.r+14)bossWalk(b,b.ang,BOSSES[3].spd+ph*4,dt);
      if(d<b.r+24&&b.cd2<=0){b.st='stompw';b.t=.6;}
      else if(b.cd<=0&&Math.abs(df)<.35&&d<280){b.st='burstw';b.t=.7;}
      else if(ph===3&&b.cd4<=0&&d>70&&Math.abs(df)<.4){b.st='wind';b.t=.8;b.chain=0;b.cd4=9;b.cdN=b.cd;b.stunT=1.6;sfx('boss',.5);}
      if(ph>=2&&b.cd3<=0){b.cd3=18;bossAdds(Z_FATTY,1+ph);bossAdds(Z_WALKER,8);}
      break;
    case 'stompw':b.t-=dt;if(b.t<=0){bossShock(b,34,26);b.cd2=2.5;b.st='rec';b.t=.5;}break;
    case 'burstw':bossTurn(b,ta,.6,dt);b.t-=dt;if(b.t<=0){b.st='burst';b.n=10+ph*4;b.sp=0;}break;
    case 'burst':
      bossTurn(b,ta,.5,dt);b.sp-=dt;
      while(b.sp<=0&&b.n>0){
        b.n--;b.sp+=.07;const a=b.ang+rnd(-.1,.1);
        spawnBullet(b.x+Math.cos(b.ang)*(b.r+3),b.y+Math.sin(b.ang)*(b.r+3),Math.cos(a),Math.sin(a),260,330,7,0,0,5,-1,true);
        part(7,b.x+Math.cos(b.ang)*(b.r+5),b.y+Math.sin(b.ang)*(b.r+5),0,0,.05,'',14);sfx('hmg',volAt(b.x,b.y)*.7);
      }
      if(b.n<=0){b.st='rec';b.t=.6;b.cd=[5,4,3.2][ph-1];}
      break;
  }
}
function bossAlpha(b,tg,d,ta,dt){ // финал: броня и таран → гнездо и кислота → всё сразу
  const ph=b.phase,df=Math.abs(angDiff(b.ang,ta));
  if(ph===2){
    if(!b.rooted){
      const hx=b.home.x-b.x,hy=b.home.y-b.y;
      if(Math.hypot(hx,hy)>8){b.ang=Math.atan2(hy,hx);bossWalk(b,b.ang,85,dt);return;}
      b.rooted=true;b.st='chase';say('АЛЬФА пускает корни и зовёт орду!',2.5);
    }
    bossHive(b,tg,d,dt,3);return;
  }
  if(b.rooted){b.rooted=false;b.shell=false;b.st='chase';}
  if(b.st!=='chase')b.st='chase';
  bossTurn(b,ta,ph===1?1.5:3.2,dt);
  if(df<1.1&&d>b.r+10)bossWalk(b,b.ang,ph===1?BOSSES[4].spd:52,dt);
  if(d<b.r+18&&df<.9){b.st='swing';b.t=.45;b.swingDmg=32;}
  else if(b.cd<=0&&d>60&&df<.6){b.st='wind';b.t=ph===1?.8:.55;b.chain=ph===3?1:0;b.cdN=ph===1?6:4.5;b.stunT=1.6;sfx('boss',.5);}
  if(ph===1&&b.cd3<=0){b.cd3=16;bossAdds(-1,8);}
  if(ph===3){
    if(b.cd2<=0){b.cd2=2.6;for(let k=0;k<3;k++)lob(k&1?4:3,b.x,b.y,tg.x+rnd(-40,40),tg.y+rnd(-40,40),.9+k*.1,-1);sfx('throw',.8);}
    if(b.cd3<=0){b.cd3=12;bossAdds(-1,10);}
  }
}
function updateBoss(dt){
  const b=boss;if(!b||b.dead)return;
  b.anim+=dt;if(b.flash>0)b.flash-=dt;if(b.crack>0)b.crack-=dt;
  b.cd-=dt;b.cd2-=dt;b.cd3-=dt;b.cd4-=dt;
  if(b.st==='idle'){b.t-=dt;if(b.t<=0)b.st='chase';return;}
  const ph=b.hp>b.maxHp*.66?1:b.hp>b.maxHp*.33?2:3;
  if(ph!==b.phase){b.phase=ph;say(b.name+': ФАЗА '+ph,2.5);sfx('boss');addShake(4);b.cd=Math.min(b.cd,1.5);}
  if(b.st==='stun'){
    b.t-=dt;if(Math.random()<dt*8)part(1,b.x+rnd(-8,8),b.y-b.r,rnd(-20,20),-20,.3,'#ffe060',1);
    if(b.t<=0)b.st='chase';return;
  }
  const tg=nearestSoldier(b.x,b.y);if(!tg)return;
  const d=dist(tg,b),ta=Math.atan2(tg.y-b.y,tg.x-b.x);
  if(bossCommon(b,tg,d,ta,dt))return;
  switch(b.k){
    case 0:bossButcher(b,tg,d,ta,dt);break;
    case 1:bossHive(b,tg,d,dt,ph);break;
    case 2:bossChemist(b,tg,d,ta,dt);break;
    case 3:bossArmored(b,tg,d,ta,dt);break;
    default:bossAlpha(b,tg,d,ta,dt);
  }
}
function bossHit(dmg,dx,dy,expl,owner){
  const b=boss;if(!b||b.dead||b.st==='idle')return;
  const armored=b.k===3||(b.k===4&&b.phase===1);let m=1;
  if(b.shell)m=expl?.3:.12;                                    // панцирь Матки
  else if(armored){
    if(expl){m=.6;b.crack=4;}                                  // взрыв раскалывает броню
    else if(b.crack>0||b.st==='stun')m=1;
    else{const l=Math.hypot(dx,dy)||1;m=(dx*Math.cos(b.ang)+dy*Math.sin(b.ang))/l>.3?1.25:.04;} // в спину — полный урон
  }else if(b.st==='stun')m=1.5;
  if(m<.2){if(Math.random()<.35){part(1,b.x+rnd(-b.r,b.r),b.y+rnd(-b.r,b.r),rnd(-80,80),rnd(-80,80),.15,'#fff0c0',1);sfx('clang',volAt(b.x,b.y));}}
  else if(Math.random()<.4)blood(b.x+rnd(-b.r,b.r)*.6,b.y+rnd(-b.r,b.r)*.6,1,dx*30,dy*30);
  b.hp-=dmg*m;b.flash=.06;
  if(b.hp<=0)bossDie(owner);
}
function bossDie(owner){
  const b=boss;b.dead=true;b.hp=0;b.shell=false;
  for(let k=0;k<10;k++)blasts.push({x:b.x+rnd(-24,24),y:b.y+rnd(-24,24),r:34,dmg:0,owner:-1,t:k*.13,ff:0,fire:false});

}

function placeInitial(cnt){ // зомби, расставленные по комнатам заранее
  let placed=0;
  if(F.isBoss){
    const A=F.arena;
    for(let t=0;t<cnt*10&&placed<cnt;t++){
      const x=rndi(A.x0+1,A.x1-1),y=rndi(A.y0+1,A.y1-10);if(SOLID[map[x+y*MW]])continue;
      if(Math.hypot(x*TS-F.bx,y*TS-F.by)<60)continue;
      if(spawnZombie(rollType(),x*TS+rnd(6,10),y*TS+rnd(6,10),false))placed++;
    }
    return placed;
  }
  const rooms=regions.filter(r=>r!==F.startR&&!r.surv);if(!rooms.length)return 0; // в лагерях выживших зомби не спят
  let sum=0;for(const r of rooms){r.area=(r.x1-r.x0-1)*(r.y1-r.y0-1);r.wt=r.area*(r.type==='corr'?.35:1);r.cnt=0;sum+=r.wt;}
  for(let t=0;t<cnt*10&&placed<cnt;t++){
    let q=Math.random()*sum,r=rooms[0];for(const o of rooms){q-=o.wt;if(q<=0){r=o;break;}}
    if(r.cnt>=r.area*1.6)continue; // комната не набивается битком — зомби распределены по этажу
    const x=rndi(r.x0+1,r.x1-1),y=rndi(r.y0+1,r.y1-1),i=x+y*MW;
    if(SOLID[map[i]]||dStart[i]<14||map[i]===T.STAIRS)continue;
    if(spawnZombie(rollType(),x*TS+rnd(6,10),y*TS+rnd(6,10),false)){placed++;r.cnt++;}
  }
  return placed;
}
function spawnGroup(n){ // одна группа орды: появляется там, где её не видит отряд, и идёт на шум
  const vx0=cam.x-30,vy0=cam.y-30,vx1=cam.x+VW+30,vy1=cam.y+VH+30;let ti=-1;
  for(let pass=0;pass<2&&ti<0;pass++)for(let t=0;t<90;t++){
    const x=rndi(1,MW-2),y=rndi(1,MH-2),i=x+y*MW;if(SOLID[map[i]]||vis[i])continue;
    const f=zField[i];if(f>=INF)continue;
    if(pass===0&&(f<130||f>420))continue;if(pass===1&&f<90)continue;
    const wx=x*TS+8,wy=y*TS+8;if(wx>vx0&&wx<vx1&&wy>vy0&&wy<vy1)continue;
    ti=i;break;
  }
  if(ti<0)return 0;
  let c=0,cur=ti;
  for(let k=0;k<n;k++){
    for(let q=0;q<2;q++){const j=cur+DOFF[rndi(0,3)];if(j>=0&&j<MN&&!SOLID[map[j]]&&!vis[j])cur=j;} // растекаются по соседним клеткам
    if(spawnZombie(rollType(),tcx(cur)+rnd(-3,3),tcy(cur)+rnd(-3,3),true))c++;else break;
  }
  return c;
}
function updateSpawns(dt){
  if(F.reserve-F.queued>0){
    F.hordeT-=dt*(zAlive<12+F.n*2?3:1);
    if(F.hordeT<=0){ // волна: дробится на группы, которые выходят из разных точек с задержкой
      F.hordeT=BAL.hordeInterval(F.n);
      let n=Math.min(F.reserve-F.queued,BAL.hordeSize(F.n)),g=0;
      if(n>=10){say('Орда приближается!',1.6);sfx('groan');}
      while(n>0){const q=Math.min(n,rndi(8,BAL.hordeGroup));F.queue.push({t:g*rnd(.7,1.5),n:q});F.queued+=q;n-=q;g++;}
    }
  }
  for(let i=F.queue.length-1;i>=0;i--){
    const q=F.queue[i];q.t-=dt;if(q.t>0)continue;
    const cap=Math.min(q.n,MAXZ-zN,BAL.maxAlive-zAlive);
    if(cap<=0){q.t=1.5;continue;}
    const c=spawnGroup(cap);
    F.queue.splice(i,1);F.queued-=q.n;
    if(c>0){F.reserve-=c;F.hordeFail=0;}else if(++F.hordeFail>12)F.reserve=0;
  }
  F.alertT-=dt;
  if(F.alertT<=0){
    F.alertT=2;
    if(F.reserve<=0&&zAlive<=Math.max(8,F.total*.12)){
      for(let i=0;i<zN;i++)zombies[i].state=1; // остатки сами идут к отряду
      if(survN>0)for(const g of sgroups){if(g.alert)continue;g.alert=true;}
      if(survN>0)for(const s of survs)if(!s.dead&&!s.tg){s.lx=player.x;s.ly=player.y;s.hasL=true;s.lostT=0;} // и последние выжившие тоже
    }
  }
}

const BASS=[55,0,55,0,65.4,0,55,0,49,0,55,0,73.4,0,65.4,0];
function update(dt){
  if(NET.role==='guest'){guestUpdate(dt);return;}
  F.time+=dt;if(F.msgT>0)F.msgT-=dt;
  if(F.hurt>0)F.hurt=Math.max(0,F.hurt-dt*1.5);if(F.flash>0)F.flash=Math.max(0,F.flash-dt*.5);
  if(F.mark){F.mark.t-=dt;if(F.mark.t<=0)F.mark=null;}
  for(const b of squad)b.revHeld=false;
  updatePlayer(dt);if(state!=='play')return;
  for(let k=1;k<4;k++){const s=squad[k];if(s.remote)updateRemote(s,dt);else updateBot(s,dt);} // боец сетевого игрока или бот
  for(const b of squad)if(b.down&&!b.revHeld&&b.revive>0)b.revive=Math.max(0,b.revive-dt);
  for(let a=0;a<4;a++)for(let b=a+1;b<4;b++){ // бойцы мягко расходятся и не застревают друг в друге
    const A=squad[a],B=squad[b];if(A.down||B.down)continue;
    const ex=B.x-A.x,ey=B.y-A.y,d=Math.hypot(ex,ey);
    if(d<9&&d>.01){const f=(9-d)/d*.5;if(a>0)moveEnt(A,-ex*f,-ey*f,4);moveEnt(B,ex*f,ey*f,4);}
    else if(d<=.01)moveEnt(B,rnd(-1,1),rnd(-1,1),4);
  }
  for(const s of squad)if(!s.down)updateWeapon(s,dt);
  updateVision(dt);
  flowT-=dt;if(flowT<=0||(navDirty&&flowT<.2)){computeFlow();flowT=.3;}
  updateZombies(dt);updateSurvivors(dt);updateBoss(dt);updateBullets(dt);updateLobs(dt);updateBlasts(dt);updateHazards(dt);updateItems();updateParts(dt);updateCorpses(dt);
  if(state!=='play')return;
  updateSpawns(dt);
  noiseT-=dt;
  if(noiseT<=0){ // зомби сбегаются на звук выстрелов и взрывов
    noiseT=.2;
    if(noiseR>0){
      const r2=noiseR*noiseR;for(let i=0;i<zN;i++){const z=zombies[i];if(z.state===0&&!z.dead){const ex=z.x-noiseX,ey=z.y-noiseY;if(ex*ex+ey*ey<r2)z.state=1;}}
      for(const g of sgroups)if(!g.alert&&Math.hypot(g.x-noiseX,g.y-noiseY)<noiseR*.8)survAlert(g,noiseX,noiseY); // выжившие идут на шум боя
      noiseR=0;
    }
  }
  hearTick(dt);
  if(!F.cleared&&zAlive<=0&&F.reserve<=0&&survN<=0&&(!boss||boss.dead)&&blasts.length===0){F.cleared=true;say('ЭТАЖ ЗАЧИЩЕН — ведите отряд к лестнице!',4);sfx('clear');}
  if(F.cleared&&distXY(player,F.stx,F.sty)<22){
    let far=false;for(let k=1;k<4;k++){const s=squad[k];if(!s.down&&dist(s,player)>100){far=true;s.cmd='follow';}}
    if(far)F.prompt='Ждём отряд у лестницы…';else{finishFloor();return;}
  }
  if(F.tut>=0){
    F.tutT+=dt;const st=TUT[F.tut],done=st[1]?st[1]():false;
    if((done&&F.tutT>2.5)||F.tutT>(st[1]?16:8)){F.tut++;F.tutT=0;if(F.tut>=TUT.length){F.tut=-1;P.tut=true;}}

}
function hearTick(dt){ // зомби вне поля зрения слышны: шаги и рычание с громкостью по расстоянию + индикатор направления
