    if(h.k==='acid'){c.globalAlpha=.5*k;c.fillStyle='#6ac820';circ(c,h.x,h.y,h.r);c.globalAlpha=.6*k;c.fillStyle='#b8f060';circ(c,h.x-h.r*.2,h.y-h.r*.2,h.r*.35);}
    else if(h.k==='gas'){c.globalAlpha=.22*k;c.fillStyle='#a8c040';circ(c,h.x,h.y,h.r);}
    else{c.globalAlpha=.25*k;c.fillStyle='#ff7a20';circ(c,h.x,h.y,h.r);}
  }
  c.globalAlpha=1;
  if(F.cleared&&seen[tIdx(F.stx,F.sty)]){c.globalAlpha=.3+.25*Math.sin(F.time*6);px(c,'#fff090',F.stx-16,F.sty-16,32,32);c.globalAlpha=1;}
  for(const it of items)if(vis[tIdx(it.x,it.y)])drawItem(c,it);
  for(let i=0;i<cN;i++){const q=corpses[i],im=SPR.c[q.spr];if(!vis[tIdx(q.x,q.y)])continue;c.save();c.translate(q.x|0,q.y|0);c.rotate(q.ang);c.drawImage(im,-(im.width>>1),-(im.height>>1));c.restore();}
  const x0=ox-14,x1=ox+VW+14,y0=oy-14,y1=oy+VH+14;
  for(let i=0;i<zN;i++){
    const z=zombies[i];if(z.dead||z.x<x0||z.x>x1||z.y<y0||z.y>y1||!vis[tIdx(z.x,z.y)])continue;
    const im=SPR.z[z.spr][(z.anim|0)&1][((z.ang/TAU*16+16.5)|0)&15],hw=im.width>>1;
    c.drawImage(im,(z.x-hw)|0,(z.y-hw)|0);
    if(z.flash>0)px(c,'rgba(255,255,255,.75)',(z.x-3)|0,(z.y-3)|0,6,6);
    if(z.stun>0)px(c,'#ffe860',(z.x-1)|0,(z.y-ZT[z.type].r-4)|0,2,2);
  }
  for(const s of survs)if(!s.dead&&vis[tIdx(s.x,s.y)])drawSurv(c,s);
  for(const s of squad)drawSoldier(c,s);
  if(boss&&!boss.dead&&bossVisible())drawBoss(c,boss);
  c.setTransform(1,0,0,1,0,0);blit(c,wallCv,ox,oy);c.setTransform(1,0,0,1,-ox,-oy);
  drawBullets(c);drawParts(c);
  // затемнение: видимое — чисто, разведанное — приглушено, неразведанное — чёрное
  c.setTransform(1,0,0,1,0,0);drawLight(c,ox,oy);c.setTransform(1,0,0,1,-ox,-oy);
  drawWorldOverlay(c);
  c.setTransform(1,0,0,1,0,0);
  c.drawImage(SPR.vig,0,0);
  if(F.hurt>0){c.fillStyle='rgba(190,10,10,'+(F.hurt*.38).toFixed(3)+')';c.fillRect(0,0,VW,VH);}
  if(player.hp<player.maxHp*.3){c.strokeStyle='rgba(220,20,20,'+(.14+.1*Math.sin(F.time*7)).toFixed(3)+')';c.lineWidth=12;c.strokeRect(0,0,VW,VH);}
  if(F.flash>0){c.fillStyle='rgba(255,255,255,'+Math.min(1,F.flash*1.6).toFixed(3)+')';c.fillRect(0,0,VW,VH);}
  drawHUD();
}

/* =====================================================================
   19. HUD (отдельный холст в полном разрешении — чёткий текст)
   ===================================================================== */
function txt(s,x,y,sz,col,al){
  const c=hctx;c.font='bold '+sz+'px "Courier New",Consolas,monospace';c.textAlign=al||'left';
  c.fillStyle='rgba(0,0,0,.85)';c.fillText(s,x+.7,y+.7);c.fillStyle=col;c.fillText(s,x,y);
}
function hbar(x,y,w,h,f,col){const c=hctx;c.fillStyle='rgba(0,0,0,.7)';c.fillRect(x-1,y-1,w+2,h+2);c.fillStyle=col;c.fillRect(x,y,w*clamp(f,0,1),h);}
function edgeArrow(wx,wy,col){
  const sx=wx-F.ox,sy=wy-F.oy;if(sx>10&&sx<VW-10&&sy>10&&sy<VH-10)return;
  const c=hctx,a=Math.atan2(sy-VH/2,sx-VW/2);
  c.save();c.translate(clamp(sx,16,VW-16),clamp(sy,16,VH-16));c.rotate(a);c.fillStyle=col;
  c.beginPath();c.moveTo(7,0);c.lineTo(-4,-5);c.lineTo(-4,5);c.closePath();c.fill();c.restore();
}
function hpCol(f){return f>.5?'#4c4':f>.25?'#cc4':'#d44';}
function drawHUD(){

    txt((i?'F'+i+' ':'')+s.name,x+20,y-1,7,i===0?'#ffd84a':'#fff');
    hbar(x+20,y+8,58,3,f,hpCol(f));

    txt(i===0?'ур.'+P.squad[0].lvl:WEAPONS[ws.id].short,x+82,y,5.5,'#8a947e');
    txt(s.down?'РАНЕН':i===0?'КОМАНДИР':s.remote?'ИГРОК':(s.holdFire?'× ':'')+CMD_NAME[s.cmd]+(s.lookA!==null?' ►':''),x+82,y+8,6,s.down?'#f55':(i&&s.holdFire)?'#fa5':'#9c9');
  }

  txt(F.cleared?'ЗАЧИЩЕНО — К ЛЕСТНИЦЕ':'ЗОМБИ: '+left+(survN>0?' · ВЫЖИВШИЕ: '+survN:''),VW/2,14,7,F.cleared?'#ffe050':'#f66','center');
  if(boss&&!boss.dead){
    const bw=220;hbar(VW/2-bw/2,27,bw,5,boss.hp/boss.maxHp,boss.shell?'#7a6a8a':boss.crack>0||boss.st==='stun'?'#ff9a30':'#d02828');
    c.fillStyle='rgba(255,255,255,.5)';c.fillRect(VW/2-bw/2+bw*.33,27,1,5);c.fillRect(VW/2-bw/2+bw*.66,27,1,5);
    txt(boss.name+(boss.shell?' · ПАНЦИРЬ':boss.st==='stun'?' · ОГЛУШЁН':boss.crack>0?' · БРОНЯ РАСКОЛОТА':''),VW/2,34,6,'#fff','center');

  c.fillStyle='#f33';
  for(let i=0;i<zN;i++){const z=zombies[i];if(z.dead||!vis[tIdx(z.x,z.y)])continue;c.fillRect(mx+(z.x>>4),my+(z.y>>4),1,1);} // только видимые сейчас
  c.fillStyle='#ffa030';for(const v of survs)if(!v.dead&&vis[tIdx(v.x,v.y)])c.fillRect(mx+(v.x>>4)-.5,my+(v.y>>4)-.5,2,2);
  if(boss&&!boss.dead&&bossVisible()){c.fillStyle='#f4f';c.fillRect(mx+(boss.x>>4)-1,my+(boss.y>>4)-1,3,3);}

  for(const s of squad){c.fillStyle=s.down?'#a00':s.isPlayer?'#fff':s.color;const q=s.isPlayer?2:1.5;c.fillRect(mx+(s.x>>4)-(s.isPlayer?.5:0),my+(s.y>>4)-(s.isPlayer?.5:0),q,q);}

  txt('$ '+P.money,VW-6,my+MH+5,8,'#ffd84a','right');
  if(AU.mute)txt('ЗВУК ВЫКЛ [M]',VW-6,my+MH+16,5.5,'#a66','right');
  // --- игрок: здоровье, оружие, гранаты ---

  c.fillStyle='rgba(0,0,0,.5)';c.fillRect(3,by-2,196,44);

  if(p.reloadT>0)hbar(96,by+23,60,3,1-p.reloadT/p.reloadMax,'#fa5');
  else txt('G:'+GRENADES[p.grType].name+' ×'+p.gr[p.grType],104,by+21,6,p.gr[p.grType]?'#cfe0b0':'#855');
  let sx=6;p.weapons.forEach((q,k)=>{const nm=(k+1)+':'+WEAPONS[q.id].short;txt(nm,sx,by+33,5.5,k===p.cur?'#ffd84a':(q.mag>0||q.res>0?'#8a947e':'#733'));sx+=nm.length*3.35+5;});
  // --- команды ---
  if(NET.role==='guest')txt('ВЫ — '+player.name.toUpperCase()+' · ботами командует хост',VW/2+100,VH-9,5.5,'#9db08a','center');
  else if(TOUCH.on)txt('ОТРЯД ['+(selBot>0?squad[selBot].name:'ВСЕ')+'] — портрет слева выбирает бойца',VW/2+100,VH-29,5.5,'#9db08a','center');
  else txt('ОТРЯД ['+(selBot>0?squad[selBot].name:'ВСЕ')+']  Q За мной · X Стоять · C Вперёд · V Оборона · B Взгляд · F Дверь · T Огонь · F1–F3 боец',VW/2+100,VH-9,5.5,'#9db08a','center');
  // --- сообщения, подсказки, обучение ---
  if(F.msgT>0){c.globalAlpha=Math.min(1,F.msgT*2);txt(F.msg,VW/2,72,10,'#fff','center');c.globalAlpha=1;}
  if(F.prompt)txt(F.prompt,VW/2,VH-64,7,'#ffe9a0','center');
  if(F.tut>=0){
    const s=TUT[F.tut][0],wd=s.length*3.75+16;
    c.fillStyle='rgba(10,22,10,.82)';c.fillRect(VW/2-wd/2,46,wd,15);c.strokeStyle='#6f8a4a';c.lineWidth=.5;c.strokeRect(VW/2-wd/2,46,wd,15);
    txt(s,VW/2,50,6,'#d8f0c0','center');
  }
  if(F.cleared)edgeArrow(F.stx,F.sty,'#ffe050');

    c.strokeStyle='#ff8a70';c.lineWidth=1.5;c.beginPath();c.moveTo(-3,-7);c.lineTo(3,0);c.lineTo(-3,7);c.stroke();
    c.beginPath();c.moveTo(-8,-5);c.lineTo(-3.5,0);c.lineTo(-8,5);c.stroke();c.restore();
  }

function drawTouchUI(c){
  c.lineWidth=1;
  const stick=(s,hx,hy,col)=>{
    const on=s.id!==null,ox=on?s.ox:hx,oy=on?s.oy:hy;
    c.globalAlpha=on?.55:.2;c.strokeStyle=col;c.beginPath();c.arc(ox,oy,TSTICK,0,TAU);c.stroke();
    let kx=ox,ky=oy;if(on){let dx=s.x-ox,dy=s.y-oy;const l=Math.hypot(dx,dy);if(l>TSTICK){dx=dx/l*TSTICK;dy=dy/l*TSTICK;}kx+=dx;ky+=dy;}
    c.globalAlpha=on?.5:.16;c.fillStyle=col;c.beginPath();c.arc(kx,ky,12,0,TAU);c.fill();
  };
  stick(TOUCH.move,64,VH-80,'#cfe0b0');
  stick(TOUCH.aim,VW-150,VH-84,TOUCH.fire?'#ff7050':'#ffd84a');
  if(TOUCH.aim.id!==null){c.globalAlpha=.3;c.strokeStyle='#ff7050';c.beginPath();c.arc(TOUCH.aim.ox,TOUCH.aim.oy,TSTICK*.55,0,TAU);c.stroke();} // за этим кольцом — огонь
  for(const b of TBTN){
    const held=Object.values(TOUCH.btn).includes(b);
    c.globalAlpha=held?.75:.5;c.fillStyle=held?'#3d5228':'#0c100a';c.beginPath();c.arc(b.x,b.y,b.r,0,TAU);c.fill();
    c.globalAlpha=.85;c.strokeStyle='#8fae62';c.beginPath();c.arc(b.x,b.y,b.r,0,TAU);c.stroke();
    c.globalAlpha=1;txt(b.l,b.x,b.y-(b.r>12?4.5:3.5),b.r>12?8:6.5,'#e8f0d8','center');
  }
  if(NET.role!=='guest')TCMD.forEach((q,k)=>{
    const r=tcmdRect(k);c.globalAlpha=.55;c.fillStyle='#0c100a';c.fillRect(r[0],r[1],r[2],r[3]);
    c.globalAlpha=.85;c.strokeStyle='#6f8a4a';c.strokeRect(r[0]+.5,r[1]+.5,r[2]-1,r[3]-1);
    c.globalAlpha=1;txt(q[1],r[0]+r[2]/2,r[1]+4.5,5.5,'#cfe0b0','center');
  });
  c.globalAlpha=1;
}

document.addEventListener('click',e=>{
  const el=e.target.closest?e.target.closest('[data-act]'):null;if(!el||el.disabled)return;
  auInit();const a=el.dataset.act,k=el.dataset.k;
  switch(a){
    case 'new':P=newProfile();lastSummary='';sfx('ui');startFloor(1);break;
    case 'cont':{const p=load();if(!p)return;P=p;lastSummary='';sfx('ui');if(P.floor>TOTAL_FLOORS)showWin();else toBase();break;}
    case 'resume':setPause(false);break;
    case 'retry':if(state==='pause'){try{P=JSON.parse(snap);}catch(err){}lastSummary='';}else lastSummary='Командир погиб. Усильте отряд и попробуйте снова.';sfx('ui');toBase();break;
    case 'menu':netClose();NET.view='choose';state='menu';F=null;player=null;refreshMenu();showScreen('scrMenu');sfx('ui');break;
    case 'sel':baseSel=+k;sfx('ui');renderBase();break;
    case 'stat':{const p=P.squad[baseSel],lv=p.st[k],cost=BAL.statCost[lv];if(lv<5&&P.money>=cost){P.money-=cost;p.st[k]++;save();sfx('pickup');}renderBase();break;}
    case 'skill':{const p=P.squad[baseSel],cost=BAL.skillCost[+k];if(!p.sk[+k]&&p.sp>=cost){p.sp-=cost;p.sk[+k]=1;save();sfx('level');}renderBase();break;}
    case 'buy':{const w=WEAPONS[k];if(w&&w.floor<=P.floor&&P.money>=w.price){P.money-=w.price;P.own[k]=(P.own[k]||0)+1;save();sfx('pickup');}renderBase();break;}
    case 'go':save();sfx('ui');startFloor(P.floor);break;
    case 'fs':{ // полноэкранный режим и горизонтальная ориентация на телефоне
      try{const d=document.documentElement,f=d.requestFullscreen||d.webkitRequestFullscreen;
        if(f){const r=f.call(d);const lock=()=>{try{const o=screen.orientation;if(o&&o.lock)o.lock('landscape').catch(()=>{});}catch(err){}};if(r&&r.then)r.then(lock).catch(()=>{});else lock();}}catch(err){}
      break;}
    case 'net':NET.view=NET.role==='host'?'host':'choose';NET.status='';renderNet();showScreen('scrNet');sfx('ui');break;
    case 'nethost':NET.role='host';NET.view='host';NET.status='';renderNet();sfx('ui');break;
    case 'netjoinv':netClose();NET.view='guest';NET.status='';NET.code='';renderNet();sfx('ui');break;
    case 'netinv':hostInvite();sfx('ui');break;
    case 'netacc':{const p=NET.peers.find(q=>q.slot===+k);if(p)hostAccept(p);break;}
    case 'netkick':{const p=NET.peers.find(q=>q.slot===+k);if(p)hostPeerLost(p);break;}
    case 'netjoin':guestMakeAnswer();break;
    case 'netcopy':{
      const ta=$(k);if(!ta)break;ta.focus();ta.select();let ok=false;
      try{if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(ta.value);ok=true;}}catch(err){}
      if(!ok)try{ok=document.execCommand('copy');}catch(err){}
      NET.status=ok?'Код скопирован — отправьте его в любом мессенджере':'Выделите код и скопируйте вручную';
      const st=$('netSt');if(st)st.textContent=NET.status;sfx('ui');break;}
    case 'netopen':NET.role='host';NET.view='host';NET.status='';renderNet();showScreen('scrNet');sfx('ui');break;
    case 'netbase':toBase();sfx('ui');break;
    case 'netback':
      if(NET.view!=='choose'&&state==='base'&&NET.role==='host'){toBase();break;}
      if(NET.view==='choose'||(NET.role==='host'&&NET.peers.some(p=>p.open)&&state!=='menu')){showScreen('scrMenu');refreshMenu();break;}
      netClose();NET.view='choose';NET.status='';
      if(state==='menu'){renderNet();}else showScreen('scrMenu');
      break;
  }
});

/* =====================================================================
   22. СЕТЕВАЯ ИГРА — WebRTC прямо между браузерами, без своего сервера
   Подключение: хост создаёт код-приглашение → друг вставляет его и получает
   код-ответ → хост вставляет ответ. Коды пересылаются вручную (мессенджер).
   Хост — командир и «сервер»: считает весь мир. Гость управляет бойцом отряда
   вместо бота: сам двигает его (без задержки) и шлёт хосту ввод 30 раз в секунду.
   Хост шлёт гостю снимки мира 20 раз в секунду по ненадёжному каналу (только то,
   что рядом с гостем; зомби — в упакованном двоичном виде) и события по надёжному:
   выстрелы, взрывы, разрушения, смерти, сообщения.
   ===================================================================== */
const ICE=[{urls:['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302']}];
const HZ=['fire','acid','gas'],ITK=['ammo','med','gren','cash','ammoS','medS'];
const ZBUF=new Int16Array(900*5);
function nev(){if(NET.role==='host'&&state==='play'&&NET.peers.length)NET.ev.push(Array.prototype.slice.call(arguments));}
function netLive(){return (NET.role==='guest'&&NET.ready)||(NET.role==='host'&&NET.peers.some(p=>p.open));}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function netSend(ch,o){try{if(ch&&ch.readyState==='open')ch.send(typeof o==='string'||o instanceof ArrayBuffer?o:JSON.stringify(o));}catch(e){}}
function netSendAll(o){if(NET.role!=='host')return;const s=JSON.stringify(o);for(const p of NET.peers)if(p.open)netSend(p.dc,s);}
function b64(u){let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s);}
function unb64(s){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
async function packCode(o){ // JSON → deflate → base64 (если браузер умеет сжимать)
  const s=JSON.stringify(o);
  try{if(window.CompressionStream){const st=new Blob([s]).stream().pipeThrough(new CompressionStream('deflate-raw'));return 'Z'+b64(new Uint8Array(await new Response(st).arrayBuffer()));}}catch(e){}
  return 'J'+b64(new TextEncoder().encode(s));
}
async function unpackCode(code){
  code=String(code||'').replace(/\s+/g,'');if(code.length<20)throw new Error('код слишком короткий');
  const t=code[0],buf=unb64(code.slice(1));
  if(t==='Z'){const st=new Blob([buf]).stream().pipeThrough(new DecompressionStream('deflate-raw'));return JSON.parse(await new Response(st).text());}
  if(t==='J')return JSON.parse(new TextDecoder().decode(buf));
  throw new Error('неизвестный формат');
}
function waitIce(pc){ // ждём сбора сетевых адресов, чтобы весь код уместился в одно приглашение
  return new Promise(res=>{
    if(pc.iceGatheringState==='complete')return res();
    const t=setTimeout(res,3500);
    pc.addEventListener('icegatheringstatechange',()=>{if(pc.iceGatheringState==='complete'){clearTimeout(t);res();}});
  });
}
function netClose(){
  for(const p of NET.peers){try{p.pc.close();}catch(e){}const s=squad[p.slot];if(s&&s.remote){s.remote=false;s.name=SQUAD_DEF[p.slot].name;}}
  NET.peers=[];
  if(NET.pc)try{NET.pc.close();}catch(e){}
  NET.pc=null;NET.dc=null;NET.sdc=null;NET.role=null;NET.ready=false;NET.code='';NET.ev=[];NET.lastTm=-1;
}

async function hostInvite(){
  const slot=[1,2,3].find(k=>!NET.peers.some(p=>p.slot===k));if(!slot)return;
  if(!window.RTCPeerConnection){NET.status='Этот браузер не поддерживает WebRTC';renderNet();return;}
  NET.role='host';
  const pc=new RTCPeerConnection({iceServers:ICE});
  const p={slot,pc,dc:null,sdc:null,open:false,name:SQUAD_DEF[slot].name,inp:null,acts:[],code:'',ans:'',st:'make'};
  p.dc=pc.createDataChannel('ctl',{ordered:true});
  p.sdc=pc.createDataChannel('snap',{ordered:false,maxRetransmits:0});
  p.dc.onopen=()=>hostPeerOpen(p);p.dc.onclose=()=>hostPeerLost(p);
  p.dc.onmessage=e=>hostMsg(p,e.data);p.sdc.onmessage=e=>hostMsg(p,e.data);
  pc.onconnectionstatechange=()=>{if(pc.connectionState==='failed'){NET.status='Не удалось соединиться с '+p.name+' (сеть/NAT). Попробуйте ещё раз.';hostPeerLost(p);}};
  NET.peers.push(p);renderNet();
  try{
    await pc.setLocalDescription(await pc.createOffer());await waitIce(pc);
    p.code=await packCode({v:1,slot,sdp:pc.localDescription.sdp});p.st='wait';
  }catch(e){p.st='err';NET.status='Ошибка приглашения: '+e.message;}
  renderNet();
}
async function hostAccept(p){
  try{
    const o=await unpackCode(p.ans);if(!o.sdp||o.slot!==undefined)throw new Error('это не код-ответ');
    p.name=String(o.name||'').trim().slice(0,12)||p.name;
    await p.pc.setRemoteDescription({type:'answer',sdp:o.sdp});p.st='conn';NET.status='';
  }catch(e){NET.status='Неверный код-ответ: '+e.message;}
  renderNet();
}
function applyRemote(p){const s=squad[p.slot];if(s&&p.open){s.remote=true;s.name=p.name;s.path=null;s.trigger=false;}}
function hostPeerOpen(p){
  p.open=true;p.st='open';NET.status='';
  netSend(p.dc,{t:'hi',slot:p.slot});
  if(F&&(state==='play'||state==='pause')){netSendFloor(p);say(p.name+' подключился',2.5);}
  else if(state==='base')netSend(p.dc,{t:'base',sum:lastSummary});
  sfx('level');renderNet();
}
function hostPeerLost(p){
  const i=NET.peers.indexOf(p);if(i<0)return;NET.peers.splice(i,1);
  try{p.pc.close();}catch(e){}
  const s=squad[p.slot];if(s&&s.remote){s.remote=false;s.name=SQUAD_DEF[p.slot].name;s.cmd='follow';s.trigger=false;s.path=null;}
  if(p.open&&F&&state==='play')say(p.name+' отключился — бойцом снова управляет ИИ',3);
  renderNet();
}
function hostMsg(p,data){
  let o;try{o=JSON.parse(data);}catch(e){return;}
  if(o.t==='in')p.inp=o;else if(o.t==='act'&&p.acts.length<40)p.acts.push(o);
}
function updateRemote(s,dt){ // боец сетевого игрока на стороне хоста
  const p=NET.peers.find(q=>q.slot===s.idx);
  if(!p||!p.open){s.remote=false;s.name=SQUAD_DEF[s.idx].name;return;}
  if(s.barkT>0)s.barkT-=dt;if(s.hurtT>0)s.hurtT-=dt;s.kx=0;s.ky=0;
  if(s.down){s.trigger=false;p.acts.length=0;return;}
  const i=p.inp;
  if(i){
    if(Math.hypot(i.x-s.x,i.y-s.y)<80&&boxFree(i.x,i.y,4)){s.x=i.x;s.y=i.y;} // позицию двигает сам гость
    s.ang=i.a;s.aimDist=i.d;s.head=i.h;s.trigger=!!i.f;
    if(i.e){const it=interactTarget(s);if(it&&it.k==='rev')reviveTick(s,it.b,true,dt);}
  }
  for(const a of p.acts){
    if(a.a==='r')startReload(s);
    else if(a.a==='w'){if(a.k>=0&&a.k<s.weapons.length&&a.k!==s.cur)switchWeapon(s,a.k);}
    else if(a.a==='g'){const g=clamp(a.k|0,0,2);if(!throwGrenade(s,+a.x,+a.y,g))netSend(p.dc,{t:'m',x:'Нет гранат: '+GRENADES[g].name});}
    else if(a.a==='u'){const it=interactTarget(s);if(it&&it.k!=='rev')applyUse(it);}
  }
  p.acts.length=0;
}
function netSoldier(s){ // компактное состояние бойца для гостя
  return [+s.x.toFixed(1),+s.y.toFixed(1),+s.ang.toFixed(3),Math.ceil(s.hp),s.maxHp,s.down?1:0,+s.revive.toFixed(2),s.cmd,s.holdFire?1:0,

function buildSnap(p){ // снимок мира вокруг бойца гостя: JSON-заголовок + двоичный массив зомби
  const s=squad[p.slot],x0=s.x-VW/2-150,x1=s.x+VW/2+150,y0=s.y-VH/2-130,y1=s.y+VH/2+130;
  const inR=(x,y)=>x>x0&&x<x1&&y>y0&&y<y1;
  const h={t:'s',tm:+F.time.toFixed(3),z:zAlive+F.reserve,sv:survN,cl:F.cleared?1:0,m:P.money,q:squad.map(netSoldier),
    b:boss?[boss.k,+boss.x.toFixed(1),+boss.y.toFixed(1),+boss.ang.toFixed(2),Math.ceil(boss.hp),boss.maxHp,boss.st,boss.phase,boss.shell?1:0,boss.crack>0?1:0,boss.flash>0?1:0,boss.dead?1:0]:null,
    h:hazards.map(z=>[HZ.indexOf(z.k),z.x|0,z.y|0,z.r|0,+z.t.toFixed(1),+z.max.toFixed(1)]),it:[],v:[]};
  for(const it of items)if(inR(it.x,it.y))h.it.push([ITK.indexOf(it.k),it.x|0,it.y|0,it.crate?1:0]);
  for(const v of survs)if(!v.dead&&inR(v.x,v.y))h.v.push([v.id,+v.x.toFixed(1),+v.y.toFixed(1),+v.ang.toFixed(2),Math.ceil(v.hp),v.maxHp,v.skin,SURV_WIDS.indexOf(v.w),v.flash>0?1:0,v.stun>0?1:0]);
  let n=0;
  for(let i=0;i<zN&&n<900;i++){
    const z=zombies[i];if(z.dead||!inR(z.x,z.y))continue;const o=n*5;let a=z.ang;if(a<0)a+=TAU;
    ZBUF[o]=z.nid;ZBUF[o+1]=Math.round(z.x*4);ZBUF[o+2]=Math.round(z.y*4);ZBUF[o+3]=(z.spr<<8)|(((a/TAU*256)|0)&255);
    ZBUF[o+4]=(z.type<<8)|(z.flash>0?1:0)|(z.stun>0?2:0)|(z.burn>0?4:0)|(z.state?8:0);n++;
  }
  const js=new TextEncoder().encode(JSON.stringify(h)),off=(4+js.length+1)&~1,buf=new ArrayBuffer(off+n*10);
  new DataView(buf).setUint32(0,js.length,true);new Uint8Array(buf,4,js.length).set(js);new Int16Array(buf,off,n*5).set(ZBUF.subarray(0,n*5));
  return buf;
}
function netTick(dt){
  if(NET.role==='host'){
    if(!F||(state!=='play'&&state!=='pause')){NET.ev.length=0;return;}
    if(NET.ev.length){const s=JSON.stringify({t:'ev',e:NET.ev});NET.ev=[];for(const p of NET.peers)if(p.open)netSend(p.dc,s);}
    NET.snapT-=dt;if(NET.snapT>0)return;NET.snapT=.05;
    for(const p of NET.peers)if(p.open&&p.sdc.readyState==='open'&&p.sdc.bufferedAmount<262144)netSend(p.sdc,buildSnap(p));
  }else if(NET.role==='guest'&&NET.ready&&player&&(state==='play'||state==='pause')){
    NET.inT-=dt;if(NET.inT>0)return;NET.inT=.033;
    const p=player,act=state==='play'&&!p.down;
    netSend(NET.sdc,{t:'in',x:+p.x.toFixed(1),y:+p.y.toFixed(1),a:+p.ang.toFixed(3),d:p.aimDist|0,h:+p.head.toFixed(2),f:act&&mouse.down?1:0,e:act&&keys.KeyE?1:0});
  }
}
/* --- гость --- */
async function guestMakeAnswer(){
  NET.status='';NET.code='';
  let o;
  try{o=await unpackCode(NET.inv);if(!o.sdp||!o.slot)throw new Error('это не код-приглашение');}
  catch(e){NET.status='Неверный код приглашения: '+e.message;renderNet();return;}
  if(!window.RTCPeerConnection){NET.status='Этот браузер не поддерживает WebRTC';renderNet();return;}
  netClose();NET.role='guest';NET.view='guest';NET.slot=o.slot;NET.status='Создаём код-ответ…';renderNet();
  const pc=new RTCPeerConnection({iceServers:ICE});NET.pc=pc;
  pc.ondatachannel=e=>{
    const ch=e.channel;ch.binaryType='arraybuffer';
    if(ch.label==='ctl'){NET.dc=ch;ch.onmessage=ev=>guestMsg(ev.data);ch.onclose=()=>guestLost('Хост отключился');}
    else{NET.sdc=ch;ch.onmessage=ev=>guestSnap(ev.data);}
  };
  pc.onconnectionstatechange=()=>{
    if(pc.connectionState==='connected'&&!NET.ready){NET.status='Подключено! Ждём, пока хост начнёт этаж…';renderNet();}
    else if(pc.connectionState==='failed')guestLost('Не удалось соединиться с хостом (сеть/NAT)');
  };
  try{
    await pc.setRemoteDescription({type:'offer',sdp:o.sdp});
    await pc.setLocalDescription(await pc.createAnswer());await waitIce(pc);
    NET.code=await packCode({v:1,name:(NET.name||'').trim()||SQUAD_DEF[o.slot].name,sdp:pc.localDescription.sdp});
    NET.status='Отправьте код-ответ хосту и ждите подключения. Вы будете играть за: '+SQUAD_DEF[o.slot].name+' ('+CLASSES[SQUAD_DEF[o.slot].cls].name+')';
  }catch(e){NET.status='Ошибка: '+e.message;}
  renderNet();
}
function guestLost(why){
  if(NET.role!=='guest')return;
  netClose();NET.view='guest';NET.status=why||'Связь с хостом потеряна';
  state='menu';F=null;player=null;renderNet();showScreen('scrNet');
}
function waitHtml(title,text){return '<h2>'+title+'</h2><div class="tag" style="max-width:50em;text-align:center">'+text+'</div><div class="col"><button data-act="menu">Отключиться</button></div>';}
function guestMsg(data){

  switch(o.t){
    case 'hi':NET.slot=o.slot;NET.status='Подключено! Ждём, пока хост начнёт этаж…';if(state==='menu')renderNet();break;
    case 'fl':guestFloor(o);break;
    case 'ev':if(F&&NET.ready)for(const e of o.e)guestEv(e);break;
    case 'base':NET.ready=false;state='base';$('scrWait').innerHTML=waitHtml('ОТРЯД НА БАЗЕ',(o.sum?esc(o.sum)+'<br><br>':'')+'Хост прокачивает бойцов и раздаёт оружие. Следующий этаж начнётся автоматически.');showScreen('scrWait');break;
    case 'over':NET.ready=false;state='base';$('scrWait').innerHTML=waitHtml('КОМАНДИР ПОГИБ',esc(o.info));showScreen('scrWait');sfx('down');break;
    case 'win':NET.ready=false;state='win';$('winInfo').innerHTML=o.html;showScreen('scrWin');sfx('clear');break;
    case 'm':if(F)say(o.x,2,true);break;
  }
}

function guestApplySoldier(s,q,own){
  if(own){ // свой боец движется локально; поправляем только при падении или сильном расхождении
    if(q[5]||Math.hypot(q[0]-s.x,q[1]-s.y)>64){s.x=q[0];s.y=q[1];}
    if(q[3]<s.hp-.5&&!s.down){F.hurt=Math.min(1,F.hurt+(s.hp-q[3])/22);addShake(1.5);sfx('hurt');s.hurtT=.25;}
    if(q[5]&&!s.down)say('Вы ранены! Союзник может поднять вас, удерживая E рядом',3,true);
  }else{
    s.tx=q[0];s.ty=q[1];s.ta=q[2];
    if(Math.hypot(q[0]-s.x,q[1]-s.y)>80){s.x=q[0];s.y=q[1];}
    if(q[3]<s.hp-.5)s.hurtT=.25;
  }
  s.hp=q[3];s.maxHp=q[4];s.down=!!q[5];s.revive=q[6];s.cmd=q[7];s.holdFire=!!q[8];s.lookA=q[9];s.cur=q[10];
  s.weapons=q[11].map(w=>({id:w[0],mag:w[1],max:w[2],res:w[3]<0?Infinity:w[3],resMax:w[4]<0?Infinity:w[4]}));
  if(s.cur>=s.weapons.length)s.cur=-1;
  s.pistol.mag=q[12];s.reloadT=q[13];s.reloadMax=q[14]||1;s.gr=q[15];
  if(q[16]){s.bark=q[16];s.barkT=Math.max(s.barkT,.3);}
  if(q[17])s.flashT=.08;
  s.remote=!!q[18];s.name=q[19];s.speed=q[20];s.downA=q[21];s.bloom=q[22];
}

function guestSnap(buf){
  if(!(buf instanceof ArrayBuffer)||!F||!NET.ready||buf.byteLength<6)return;
  const len=new DataView(buf).getUint32(0,true);let h;
  try{h=JSON.parse(new TextDecoder().decode(new Uint8Array(buf,4,len)));}catch(e){return;}
  if(h.tm<=NET.lastTm)return;NET.lastTm=h.tm; // снимки идут по ненадёжному каналу — старые отбрасываем
  zAlive=h.z;survN=h.sv;F.cleared=!!h.cl;P.money=h.m;
  for(let i=0;i<4;i++)guestApplySoldier(squad[i],h.q[i],i===NET.slot);
  if(h.b){
    if(!boss||boss.k!==h.b[0]){const d=BOSSES[h.b[0]];boss={k:h.b[0],name:d.name,isBoss:true,r:d.r,x:h.b[1],y:h.b[2],ang:h.b[3],anim:0,flash:0,crack:0,shell:false,st:'idle',phase:1,hp:h.b[4],maxHp:h.b[5],dead:false};}
    const b=boss;b.tx=h.b[1];b.ty=h.b[2];b.ang=h.b[3];b.hp=h.b[4];b.maxHp=h.b[5];b.st=h.b[6];b.phase=h.b[7];b.shell=!!h.b[8];b.crack=h.b[9]?1:0;if(h.b[10])b.flash=.06;b.dead=!!h.b[11];
    if(Math.hypot(b.tx-b.x,b.ty-b.y)>80){b.x=b.tx;b.y=b.ty;}
  }else boss=null;
  hazards=h.h.map(a=>({k:HZ[a[0]]||'fire',x:a[1],y:a[2],r:a[3],t:a[4],max:a[5],tick:9,owner:-1}));
  items=h.it.map(a=>({k:ITK[a[0]]||'ammoS',x:a[1],y:a[2],crate:!!a[3]}));
  const sm=new Map();
  survs=h.v.map(a=>{let v=NET.smap.get(a[0]);if(!v)v={isSurv:true,id:a[0],x:a[1],y:a[2],dead:false};
    v.tx=a[1];v.ty=a[2];v.ang=a[3];v.hp=a[4];v.maxHp=a[5];v.skin=a[6];v.w=SURV_WIDS[a[7]]||'pistol';v.flash=a[8]?.06:0;v.stun=a[9]?1:0;sm.set(a[0],v);return v;});
  NET.smap=sm;
  // зомби: сохраняем текущие (сглаженные) позиции по id, затем переписываем пул из снимка
  const old=new Map();for(let k=0;k<zN;k++){const z=zombies[k];old.set(z.nid,[z.x,z.y,z.anim]);}
  const off=(4+len+1)&~1,n=Math.min(MAXZ,((buf.byteLength-off)/10)|0),a=new Int16Array(buf,off,n*5);
  for(let k=0;k<n;k++){
    const o=k*5,z=zombies[k],tx=a[o+1]/4,ty=a[o+2]/4,pr=old.get(a[o]);
    if(pr){z.x=pr[0];z.y=pr[1];z.anim=pr[2];}else{z.x=tx;z.y=ty;z.anim=rnd(2);}
    z.tx=tx;z.ty=ty;z.nid=a[o];z.spr=(a[o+3]>>8)&255;z.ang=((a[o+3]&255)/256)*TAU;if(z.ang>Math.PI)z.ang-=TAU;
    const fl=a[o+4];z.type=(fl>>8)&255;z.flash=fl&1?.06:0;z.stun=fl&2?1:0;z.burn=fl&4?1:0;z.state=fl&8?1:0;z.dead=false;
  }
  zN=n;
}
function shotFx(s,a,wid,ad){ // у гостя: выстрел бойца — пули-картинки, вспышка, гильза, звук, отдача
  const w=WEAPONS[wid]||WEAPONS.pistol,own=s===player;if(own)a=s.ang;
  const ca=Math.cos(a),sa=Math.sin(a);let mx=s.x+ca*10,my=s.y+sa*10;if(solidAt(mx,my)){mx=s.x+ca*3;my=s.y+sa*3;}
  const kind=w.proj==='flame'?1:w.proj==='shell'?2:w.proj==='rocket'?3:0;
  for(let i=0;i<w.pel;i++){
    const q=a+(Math.random()+Math.random()-1)*(w.spread+s.bloom);
    spawnBullet(mx,my,Math.cos(q),Math.sin(q),w.spd*(kind===1?rnd(.7,1.1):1),kind===2?clamp(ad-10,30,w.range):w.range,0,w.knock,0,kind,s.idx,false);
  }
  if(w.flash){part(7,mx+ca*4,my+sa*4,0,0,.05,'',w.flash);s.flashT=.08;}
  if(kind===0)part(3,s.x+ca*4,s.y+sa*4,-sa*rnd(30,70),ca*rnd(30,70),rnd(.3,.5),w.cls==='sg'?'#c03a2a':'#d8b040',1);
  const v=volAt(s.x,s.y);sfx(w.snd,own?1:v*.8);
  if(own){addShake(w.shake);cam.kx-=ca*w.kick;cam.ky-=sa*w.kick;}else addShake(w.shake*.2*v);
}
function guestEv(e){
  switch(e[0]){
    case 'sh':{const s=squad[e[1]];if(s)shotFx(s,e[2],e[3],e[4]);break;}
    case 'ss':survShotFx(e[1],e[2],e[3],e[4]);break;
    case 'ex':explodeFx(e[1],e[2],e[3]);break;
    case 'k':killFx(e[1],e[2],e[3],e[4],e[5],e[6],e[7]);break;
    case 't':{
      const i=e[1];if(i<0||i>=MN)break;map[i]=e[2];drawTile(i);visDirty=true;
      if(e[2]===T.DOOR_OPEN||(e[2]===T.DOOR&&e[3]===T.DOOR_OPEN))sfx('door',volAt(tcx(i),tcy(i)));else tileFx(e[3],tcx(i),tcy(i));
      break;}
    case 'm':say(e[1],e[2],true);break;
    case 'l':lobs.push({k:e[1],sx:e[2],sy:e[3],tx:e[4],ty:e[5],t:0,dur:e[6],owner:e[7]});if(e[1]<3)sfx('throw',volAt(e[2],e[3]));break;
    case 'sf':sfx(e[1]);break;
  }
}
function netAct(o){o.t='act';netSend(NET.dc,o);}
function guestUpdate(dt){ // кадр у гостя: свой боец + сглаживание всего остального + картинка
  F.time+=dt;if(F.msgT>0)F.msgT-=dt;
  if(F.hurt>0)F.hurt=Math.max(0,F.hurt-dt*1.5);if(F.flash>0)F.flash=Math.max(0,F.flash-dt*.5);
  const p=player;if(p.hurtT>0)p.hurtT-=dt;if(p.barkT>0)p.barkT-=dt;
  mouse.wx=cam.x+mouse.x;mouse.wy=cam.y+mouse.y;
  if(!p.down){
    const mv=moveInput(),w=WEAPONS[curWS(p).id];
    let touch=0;for(let i=0;i<zN;i++){const z=zombies[i];if(Math.abs(z.x-p.x)<9&&Math.abs(z.y-p.y)<9)touch++;}
    moveLocal(p,mv[0],mv[1],p.speed*(w.slow&&mouse.down?w.slow:1)/(1+.3*Math.min(4,touch)),dt);
    p.ang=Math.atan2(mouse.wy-p.y,mouse.wx-p.x);p.aimDist=Math.hypot(mouse.wx-p.x,mouse.wy-p.y);
    for(let k=0;k<4;k++)if(pressed['Digit'+(k+1)]&&k<p.weapons.length&&k!==p.cur){netAct({a:'w',k});sfx('ui');}
    if(mouse.wheel&&p.weapons.length>1){
      let k=p.cur<0?0:p.cur;const dir=mouse.wheel>0?1:-1;
      for(let t=0;t<p.weapons.length;t++){k=(k+dir+p.weapons.length)%p.weapons.length;const ws=p.weapons[k];if(ws.mag>0||ws.res>0)break;}
      if(k!==p.cur){netAct({a:'w',k});sfx('ui');}
    }
    if(pressed.KeyR){netAct({a:'r'});sfx('reload');}
    if(pressed.KeyZ){p.grType=(p.grType+1)%3;say('Граната: '+GRENADES[p.grType].name+' ×'+p.gr[p.grType],1.2,true);sfx('ui');}
    if(pressed.KeyG||pressed.Mouse2){if(p.gr[p.grType]>0)netAct({a:'g',x:mouse.wx|0,y:mouse.wy|0,k:p.grType});else{sfx('deny');say('Нет гранат: '+GRENADES[p.grType].name,1.2,true);}}
    const it=interactTarget(p);F.prompt=it?interactText(it):'';
    if(it&&it.k!=='rev'&&pressed.KeyE)netAct({a:'u'});
  }else F.prompt='Вы ранены — союзник поднимет вас, удерживая E рядом';
  if(pressed.KeyQ||pressed.KeyX||pressed.KeyC||pressed.KeyV||pressed.KeyF||pressed.KeyT||pressed.KeyB)say('Ботами командует хост (командир)',1.5,true);
  const k=Math.min(1,dt*14);
  for(const s of squad)if(s!==p){s.x+=(s.tx-s.x)*k;s.y+=(s.ty-s.y)*k;s.ang+=angDiff(s.ang,s.ta)*k;if(s.barkT>0)s.barkT-=dt;if(s.hurtT>0)s.hurtT-=dt;}
  if(boss){boss.x+=(boss.tx-boss.x)*k;boss.y+=(boss.ty-boss.y)*k;boss.anim+=dt;if(boss.flash>0)boss.flash-=dt;}
  for(const v of survs){v.x+=(v.tx-v.x)*k;v.y+=(v.ty-v.y)*k;if(v.flash>0)v.flash-=dt;}
  gridHead.fill(-1);
  for(let i=0;i<zN;i++){
    const z=zombies[i],ox=z.x,oy=z.y;z.x+=(z.tx-z.x)*k;z.y+=(z.ty-z.y)*k;
    if(Math.abs(z.x-ox)+Math.abs(z.y-oy)>.05)z.anim+=dt*4;if(z.flash>0)z.flash-=dt;
    const c=tIdx(z.x,z.y);gridNext[i]=gridHead[c];gridHead[c]=i;
  }
  for(const h of hazards){
    h.t=Math.max(0,h.t-dt);
    if(h.k==='fire'){if(Math.random()<dt*h.r*.8){const a=rnd(TAU),d=rnd(h.r);part(6,h.x+Math.cos(a)*d,h.y+Math.sin(a)*d,rnd(-6,6),rnd(-30,-10),rnd(.3,.6),'',rnd(3,5));}}
    else if(h.k==='gas'){if(Math.random()<dt*10){const a=rnd(TAU),d=rnd(h.r);part(2,h.x+Math.cos(a)*d,h.y+Math.sin(a)*d,rnd(-8,8),rnd(-8,8),rnd(.6,1.2),'#a8c040',rnd(7,11));}}
    else if(Math.random()<dt*h.r*.3){const a=rnd(TAU),d=rnd(h.r);part(1,h.x+Math.cos(a)*d,h.y+Math.sin(a)*d,0,-12,.3,'#d8ff80',1);}
  }
  for(const s of squad)if(s.reloadT>0)s.reloadT=Math.max(0,s.reloadT-dt);
  updateVision(dt);updateBullets(dt);updateLobs(dt);updateParts(dt);updateCorpses(dt);
  hearTick(dt);cameraTick(dt);ambientTick(dt);
}

let lastT=0;
function frame(t){
  requestAnimationFrame(frame);
  let dt=(t-lastT)/1000;lastT=t;if(!(dt>0))dt=0;if(dt>.05)dt=.05; // движение не зависит от частоты кадров
  touchFrame();
  if(state==='play')update(dt);
  netTick(dt);
  render(t);
  pressed={};mouse.wheel=0;
}
